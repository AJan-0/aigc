                    role="dialog" aria-modal="true" aria-label="Video Player"
                    onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
                    onMouseMove={handleMouseMove}
                    onTouchStart={handleTouchStart}
                    onTouchEnd={handleTouchEnd}
                >
                    <div className="video-modal-container" id="videoModalWrapper">
                        {/* Top thin progress bar — always visible */}
                        <div className="video-top-progress" style={{opacity: showControls || !isPlaying ? 1 : 0}}>
                            <div className="video-top-progress-buffer" style={{width: buffered + '%'}} />
                            <div className="video-top-progress-fill" style={{width: progress + '%'}} />
                        </div>

                        {/* Loading spinner */}
                        {isLoading && (
                            <div className="video-modal-loading">
                                <div className="video-modal-spinner"></div>
                                <p style={{color: '#94a3b8', textAlign: 'center', marginTop: '12px', fontSize: '14px'}}>正在同步作品数据与影像资源...</p>
                            </div>
                        )}

                        {/* Error state */}
                        {hasError && (
                            <div className="video-modal-loading">
                                <p style={{color: '#94a3b8', textAlign: 'center'}}>视频加载失败<br/><small>请检查网络连接</small></p>
                                <button 
                                    onClick={() => { setHasError(false); setIsLoading(true); retryCountRef.current = 0; if (videoRef.current) videoRef.current.load(); }}
                                    style={{marginTop: '12px', padding: '10px 28px', background: 'linear-gradient(135deg, #3B82F6, #8B5CF6)', color: 'white', border: 'none', borderRadius: '8px', cursor: 'pointer', fontSize: '14px', fontWeight: 500}}
                                >重试</button>
                            </div>
                        )}

                        {/* Video element */}
                        <video
                            ref={videoRef}
                            src={project.videoUrl}
                            poster={project.image}
                            className="video-modal-video"
                            playsInline
                            preload="auto"
                            autoPlay={false}
                            muted={false}
                            onClick={isMobile ? undefined : togglePlay}
                            onLoadStart={() => setIsLoading(true)}
                            onWaiting={() => setIsLoading(true)}
                            onPlaying={() => { setIsLoading(false); setIsPlaying(true); }}
                            onCanPlay={() => setIsLoading(false)}
                            onCanPlayThrough={() => setIsLoading(false)}
                            onLoadedData={() => setIsLoading(false)}
                            onLoadedMetadata={() => setIsLoading(false)}
                            onError={(e) => {
                                const err = e.target.error;
                                console.error('Video error:', err ? err.code : 'unknown', err ? err.message : '');
                                if (err && (err.code === 2 || err.code === 3) && retryCountRef.current < 3) {
                                    retryCountRef.current++;
                                    setTimeout(() => { if (videoRef.current) videoRef.current.load(); }, 1000 * retryCountRef.current);
                                } else {
                                    setIsLoading(false);
                                    setHasError(true);
                                }
                            }}
                            onStalled={() => {
                                if (!stalledHandledRef.current) {
                                    stalledHandledRef.current = true;
                                    if (videoRef.current) videoRef.current.load();
                                    setTimeout(() => { stalledHandledRef.current = false; }, 5000);
                                }
                            }}
                            onProgress={() => {
                                if (videoRef.current && videoRef.current.buffered.length > 0) {
                                    const bufferedEnd = videoRef.current.buffered.end(videoRef.current.buffered.length - 1);
                                    const dur = videoRef.current.duration;
                                    if (dur > 0) setBuffered(Math.round((bufferedEnd / dur) * 100));
                                }
                            }}
                            onTimeUpdate={() => {
                                if (!videoRef.current) return;
                                setProgress((videoRef.current.currentTime / videoRef.current.duration) * 100);
                                setCurrentTime(formatTime(videoRef.current.currentTime));
                            }}
                            onLoadedMetadata={() => {
                                if (videoRef.current) setDuration(formatTime(videoRef.current.duration));
                            }}
                            onEnded={() => { setIsPlaying(false); setShowControls(true); }}
                        />

                        {/* Center play button (visible when paused) */}
                        {!isPlaying && !hasError && (
                            <div className="video-modal-bigplay" onClick={togglePlay} style={{zIndex: 10}}>
                                <div className="video-modal-bigplay-btn">
                                    <svg width="28" height="28" viewBox="0 0 24 24" fill="white">
                                        <path d="M8 5v14l11-7z"/>
                                    </svg>
                                </div>
                            </div>
                        )}

                        {/* Close button */}
                        <button className="video-modal-close" onClick={onClose} title="关闭">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>

                        {/* Bottom controls bar */}
                        <div className={`video-modal-controls ${showControls || !isPlaying ? 'visible' : ''}`}>
                            <button onClick={togglePlay} title={isPlaying ? '暂停' : '播放'}>
                                {isPlaying ? (
                                    <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
                                        <rect x="6" y="4" width="4" height="16" rx="1"/>
                                        <rect x="14" y="4" width="4" height="16" rx="1"/>
                                    </svg>
                                ) : (
                                    <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
                                        <path d="M8 5v14l11-7z"/>
                                    </svg>
                                )}
                            </button>

                            <span className="video-modal-time">{currentTime}</span>

                            <div className="video-modal-progress" onClick={seekTo}>
                                <div className="video-modal-progress-buffer" style={{width: buffered + '%'}} />
                                <div className="video-modal-progress-fill" style={{width: progress + '%'}} />
                            </div>

                            <span className="video-modal-time">{duration}</span>

                            <button onClick={toggleMute} title={isMuted ? '取消静音' : '静音'}>
                                {isMuted ? (
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
                                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                                        <line x1="23" y1="9" x2="17" y2="15"/>
                                        <line x1="17" y1="9" x2="23" y2="15"/>
                                    </svg>
                                ) : (
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
                                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                                    </svg>
                                )}
                            </button>

                            <button onClick={cycleSpeed} className="speed-btn" title="播放速度">
                                {playbackRate}x
                            </button>
                            <button onClick={togglePiP} title="画中画">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
                                    <rect x="2" y="3" width="20" height="14" rx="2"/>
                                    <rect x="12" y="9" width="8" height="6" rx="1" fill="white" opacity="0.5"/>
                                </svg>
                            </button>

                            <button onClick={toggleFullscreen} title={isFullscreen ? '退出全屏' : '全屏'}>
                                {isFullscreen ? (
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
                                        <path d="M8 3v3a2 2 0 0 1-2 2H3"/>
                                        <path d="M21 8h-3a2 2 0 0 1-2-2V3"/>
                                        <path d="M3 16h3a2 2 0 0 1 2 2v3"/>
                                        <path d="M16 21v-3a2 2 0 0 1 2-2h3"/>
                                    </svg>
                                ) : (
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
                                        <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
                                        <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
                                        <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
                                        <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
                                    </svg>
                                )}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Toast notification system
        function showToast(message, type = 'info', duration = 3000) {
            let container = document.getElementById('toastContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toastContainer';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('exit');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }
        window.showToast = showToast;

        function App() {
            const pageLoading = usePageLoading();
            const [projects, setProjects] = React.useState(PROJECTS_DATA);
            const [projectsLoading, setProjectsLoading] = React.useState(true);
            const [selectedVideo, setSelectedVideo] = React.useState(null);
            const scrollPosRef = React.useRef(0);
            
            const openVideo = React.useCallback((project) => {
                scrollPosRef.current = window.scrollY;
                setSelectedVideo(project);
            }, []);
            
            const closeVideo = React.useCallback(() => {
                setSelectedVideo(null);
                requestAnimationFrame(() => {
                    window.scrollTo(0, scrollPosRef.current);
                });
            }, []);
            useScrollProgress();
            useCustomCursor();
            useFloatingParticles();

            React.useEffect(() => {
                loadProjectsFromAPI().then(data => {
                    setProjects(data);
                    setProjectsLoading(false);
                });
            }, []);

            if (pageLoading) {
                return null;
            }
            
            return (
                <>
                    <Navbar />
                    <HeroSection />
                    <ProfileIntroSection />
                    <ReelTransition />
                    <ReelProjectsSection projects={projects} projectsLoading={projectsLoading} onVideoClick={openVideo} />
                    <MethodSection />
                    <EditorialFooter />
                    
                    {/* 视频放大播放弹窗 */}
                    {selectedVideo && (
                        <VideoModal
                            project={selectedVideo}
                            onClose={closeVideo}
                        />
                    )}
                </>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        
        // 性能优化：延迟初始化以改善首屏渲染
        // 先渲染基础 UI，再初始化复杂交互
        document.addEventListener('DOMContentLoaded', () => {
            // 使用 startTransition 降低初始渲染优先级
            if (React.startTransition) {
                React.startTransition(() => {
                    root.render(<App />);
                });
            } else {
                root.render(<App />);
            }
            
            // 在 first paint 后初始化性能敏感功能
            if (window.requestIdleCallback) {
                window.requestIdleCallback(() => {
                    console.log('Performance optimization complete');
                }, { timeout: 2000 });
            }
        });
        
        // Fallback: 如果 DOM 尚未完成加载
        if (document.readyState === 'loading') {
            // 等待 DOMContentLoaded
        } else {
            // DOM 已加载，直接初始化
            if (React.startTransition) {
                React.startTransition(() => {
                    root.render(<App />);
                });
            } else {
                root.render(<App />);
            }
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
