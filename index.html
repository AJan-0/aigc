<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AIGC Visual Studio - 探索 AI 驱动的创意设计与可视化作品集">
    <title>AIGC Visual Studio | AI-Powered Creativity</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- React Ecosystem -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="src/config.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Syne', 'sans-serif'],
                        body: ['Manrope', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0F172A',
                        secondary: '#1E293B',
                        'accent-blue': '#3B82F6',
                        'accent-purple': '#8B5CF6',
                        'accent-cyan': '#06B6D4',
                    },
                }
            },
            corePlugins: {
                // 在移动端禁用非必要效果以提升性能
                accessibility: true,
                animation: true,
            }
        }
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        /* ============================================
           高级排版架构 - CSS 变量系统
           ============================================ */
        :root {
            /* 文字颜色梯度系统 - 5 级对比 */
            --text-primary:      #F8FAFC;      /* h1 标题高对比 */
            --text-secondary:    #E2E8F0;      /* h2-h3 标题 */
            --text-tertiary:     #CBD5E1;      /* 正文 */
            --text-quaternary:   #94A3B8;      /* 辅助文本、标签 */
            --text-quinary:      #64748B;      /* 图注、禁用状态 */
            
            /* 强调色系 */
            --accent-primary:    #06B6D4;      /* 青色 - 主交互 */
            --accent-secondary:  #8B5CF6;      /* 紫色 - 次强调 */
            --accent-tertiary:   #3B82F6;      /* 蓝色 - 补充 */
            
            /* 垂直韵律系统（Vertical Rhythm）- 基础单位：8px */
            --space-xs: clamp(0.25rem, 0.5vw, 0.5rem);
            --space-sm: clamp(0.5rem, 1vw, 0.75rem);
            --space-md: clamp(0.75rem, 1.5vw, 1rem);
            --space-lg: clamp(1rem, 2vw, 1.5rem);
            --space-xl: clamp(1.5rem, 3vw, 2rem);
            --space-2xl: clamp(2rem, 4vw, 2.5rem);
            --space-3xl: clamp(2.5rem, 5vw, 3rem);
            --space-4xl: clamp(3rem, 6vw, 4rem);
            --space-5xl: clamp(4rem, 8vw, 5rem);
            
            /* 行高比例 */
            --lh-tight: 1;
            --lh-snug: 1.1;
            --lh-normal: 1.5;
            --lh-relaxed: 1.75;
            --lh-loose: 2;
        }
        
        body {
            font-family: 'Manrope', sans-serif;
            background: linear-gradient(180deg, #040915 0%, #0A1327 34%, #0F172A 72%, #0F172A 100%);
            color: var(--text-tertiary);
            overflow-x: hidden;
            cursor: none;
            /* 性能优化：启用 GPU 加速 */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* 字体大小和行高 */
            font-size: clamp(0.95rem, 1vw, 1.125rem);
            font-weight: 400;
            line-height: var(--lh-relaxed);
            letter-spacing: 0.002em;
            word-spacing: 0.1em;
        }
        
        /* 性能优化：减少重绘 */
        .will-change-gpu {
            will-change: transform;
            transform: translateZ(0);
        }
        
        /* 性能优化：内容可见性，非关键内容延迟渲染 */
        @supports (content-visibility: auto) {
            .project-card-mobile,
            .feature-card-mobile {
                content-visibility: auto;
                contain-intrinsic-size: auto 400px;
            }
        }
        
        /* 性能优化：首屏 Hero 区域 GPU 加速 */
        section:first-of-type {
            contain: layout style paint;
            will-change: transform;
        }
        
        /* 性能优化：Framer Motion 元素 GPU 加速 */
        [role="heading"],
        h1, h2, h3, h4, h5, h6 {
            will-change: transform;
        }
        
        /* ============================================
           8 级高级字体系统
           ============================================ */
        
        /* Hero Massive Title - 页面主标题 */
        .typography-hero-mega,
        .hero-title-mega {
            font-size: clamp(2.5rem, 4.5vw + 0.5rem, 4.5rem);
            font-weight: 800;
            line-height: var(--lh-tight);
            letter-spacing: -0.03em;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-secondary) 0%, var(--accent-primary) 50%, var(--accent-tertiary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 4px rgba(139, 92, 246, 0.2));
        }
        
        /* Display Heading - 重要章节 */
        h1, .text-7xl, .font-display,
        .typography-display,
        .section-heading-primary {
            font-size: clamp(1.875rem, 3.5vw, 3.25rem);
            font-weight: 700;
            line-height: var(--lh-snug);
            letter-spacing: -0.015em;
            color: var(--text-primary);
        }
        
        /* Heading Secondary - 中等标题 */
        h2, .text-6xl,
        .typography-heading,
        .section-heading-secondary {
            font-size: clamp(1.5rem, 2.5vw + 0.3rem, 2.5rem);
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.01em;
            color: var(--text-secondary);
        }
        
        /* Heading Tertiary - 次级标题 */
        h3, .text-5xl,
        .typography-subheading,
        .section-heading-tertiary {
            font-size: clamp(1.25rem, 2vw + 0.2rem, 2rem);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.005em;
            color: var(--text-secondary);
        }
        
        /* Heading Quaternary */
        h4, .text-4xl,
        .typography-h4 {
            font-size: clamp(1.1rem, 1.5vw, 1.5rem);
            font-weight: 600;
            line-height: 1.25;
            letter-spacing: 0em;
            color: var(--text-tertiary);
        }
        
        /* Heading Quinary */
        h5, .text-3xl,
        .typography-h5 {
            font-size: clamp(1rem, 1.2vw, 1.25rem);
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: 0.005em;
        }
        
        /* Heading Senary */
        h6, .text-2xl,
        .typography-h6 {
            font-size: clamp(0.95rem, 1.1vw, 1.1rem);
            font-weight: 600;
            line-height: 1.4;
            letter-spacing: 0.01em;
        }
        
        /* Subtitle - heading 下的描述 */
        .typography-subtitle,
        .subtitle,
        .section-subtitle {
            font-size: clamp(1rem, 1.5vw, 1.375rem);
            font-weight: 500;
            line-height: 1.4;
            letter-spacing: 0.015em;
            color: var(--text-tertiary);
            opacity: 0.95;
        }
        
        /* Body Lead - 摘出的开场段落 */
        .typography-lead,
        .lead {
            font-size: clamp(1rem, 1.2vw, 1.25rem);
            font-weight: 500;
            line-height: 1.65;
            letter-spacing: 0.003em;
            color: var(--text-secondary);
        }
        
        /* Regular Body - 正文 */
        p,
        .typography-body,
        .body-text {
            font-size: clamp(0.95rem, 1vw, 1.125rem);
            font-weight: 400;
            line-height: var(--lh-relaxed);
            letter-spacing: 0.002em;
            color: var(--text-tertiary);
            word-spacing: 0.1em;
            margin-bottom: var(--space-lg);
            text-align: justify;
            text-justify: inter-word;
        }
        
        /* Accent Body - 强调内容 */
        .typography-body-accent,
        .body-accent {
            font-size: clamp(0.95rem, 1vw, 1.125rem);
            font-weight: 600;
            line-height: var(--lh-relaxed);
            color: var(--accent-primary);
            background: linear-gradient(135deg, transparent, rgba(6, 182, 212, 0.1));
            padding: 0 0.25em;
            text-decoration: underline 2px rgba(6, 182, 212, 0.4);
            text-decoration-skip-ink: auto;
        }
        
        /* Label / Tag - 标签文本 */
        label, .label-text,
        .typography-label,
        .tag-label {
            font-size: clamp(0.8rem, 0.85vw, 0.95rem);
            font-weight: 600;
            line-height: 1.4;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-quaternary);
        }
        
        /* Caption - 图注 */
        small, .text-sm,
        .typography-caption,
        .caption {
            font-size: clamp(0.75rem, 0.75vw, 0.875rem);
            font-weight: 500;
            line-height: 1.5;
            letter-spacing: 0.02em;
            color: var(--text-quinary);
        }
        
        /* 代码文本 */
        code {
            font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.95em;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 0.25em 0.5em;
            border-radius: 4px;
            color: var(--accent-primary);
            word-break: break-word;
        }
        
        pre {
            font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
            font-size: clamp(0.75rem, 0.85vw, 1rem);
            line-height: 1.5;
        }
        
        pre code {
            padding: 1rem;
            display: block;
            overflow-x: auto;
            background: rgba(15, 23, 42, 0.8);
            border: none;
        }
        
        /* ============================================
           动态排版装饰
           ============================================ */
        
        /* 标题下划线动画 */
        .section-title {
            position: relative;
            display: inline-block;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            border-radius: 2px;
            animation: slide-expand 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        @keyframes slide-expand {
            from {
                width: 0;
                opacity: 0;
            }
            to {
                width: 100%;
                opacity: 1;
            }
        }
        
        /* 段落行高呼吸动画 */
        .text-breathable {
            transition: line-height 0.3s ease;
        }
        
        .text-breathable:hover {
            line-height: var(--lh-loose);
        }
        
        /* 数据强调 - 关键数字放大 */
        .number-highlight {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--accent-primary);
            font-variant-numeric: tabular-nums;
        }
        
        /* 粗体词汇强调 */
        strong {
            font-weight: 700;
            color: var(--accent-secondary);
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(6, 182, 212, 0.1));
            padding: 0 0.25em;
            border-radius: 3px;
            transition: all 0.3s ease;
        }
        
        strong:hover {
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.2);
            transform: scale(1.02);
        }
        
        /* 斜体强调 */
        em {
            font-style: italic;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        /* 标题前的装饰符 */
        .subtitle-accent {
            position: relative;
            color: var(--text-primary);
        }
        
        .subtitle-accent::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 60%;
            background: linear-gradient(180deg, var(--accent-primary) 0%, transparent 100%);
            border-radius: 2px;
        }
        
        /* 可视化引用 (Visual Quote) */
        .blockquote-accent {
            position: relative;
            padding-left: 1.5em;
            color: var(--text-secondary);
            font-style: italic;
            border-left: 3px solid var(--accent-primary);
            margin-left: 0;
            margin-bottom: var(--space-lg);
        }
        
        .blockquote-accent::before {
            content: '"';
            position: absolute;
            left: 0;
            top: -0.3em;
            font-size: 3em;
            color: var(--accent-primary);
            opacity: 0.3;
        }
        
        blockquote {
            border-left: 3px solid var(--accent-primary);
            padding-left: var(--space-lg);
            margin-left: 0;
            margin-bottom: var(--space-lg);
            color: var(--text-secondary);
            font-style: italic;
        }
        
        /* ============================================
           垂直韵律系统（Vertical Rhythm）
           ============================================ */
        
        ul, ol {
            margin: var(--space-lg) 0 var(--space-lg) var(--space-lg);
            line-height: var(--lh-relaxed);
        }
        
        li {
            margin-bottom: var(--space-sm);
        }
        
        /* Section spacing */
        section {
            padding: var(--space-5xl) var(--space-xl);
        }
        
        section + section {
            border-top: 1px solid rgba(148, 163, 184, 0.1);
            margin-top: var(--space-5xl);
        }
        
        /* Heading spacing */
        h1, h2, h3, h4, h5, h6 {
            margin-top: var(--space-2xl);
            margin-bottom: var(--space-md);
            scroll-margin-top: 80px;
        }
        
        h1 {
            margin-top: var(--space-5xl);
            margin-bottom: var(--space-xl);
        }
        
        h2 {
            margin-top: var(--space-4xl);
            margin-bottom: var(--space-lg);
        }
        
        h3 {
            margin-top: var(--space-3xl);
            margin-bottom: var(--space-md);
        }
        
        /* ============================================
           高级排版风格预设 - 3 种风格系统
           ============================================ */
        
        /* 风格 A：极简专业风格（minimal-pro） */
        .style-minimal-pro {
            --text-color: var(--text-secondary);
            --accent-color: var(--accent-primary);
            
            font-size: clamp(0.95rem, 1vw, 1.1rem);
            font-weight: 500;
            line-height: var(--lh-loose);
            letter-spacing: 0.01em;
            color: var(--text-color);
            
            /* 首字母大写 + 小号大写 */
            font-variant-caps: small-caps;
        }
        
        /* 风格 B：气场强势风格（powerful-hero） */
        .style-powerful-hero {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 800;
            line-height: var(--lh-tight);
            letter-spacing: -0.03em;
            text-transform: uppercase;
            
            background: linear-gradient(135deg, 
                var(--accent-secondary) 0%, 
                var(--accent-primary) 50%, 
                var(--accent-tertiary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            
            /* 添加深度感 */
            filter: drop-shadow(0 2px 4px rgba(139, 92, 246, 0.2));
        }
        
        /* 风格 C：优雅叙事风格（narrative-elegant） */
        .style-narrative-elegant {
            font-size: clamp(0.95rem, 1.1vw, 1.2rem);
            font-weight: 400;
            line-height: var(--lh-loose);
            letter-spacing: 0.005em;
            text-align: justify;
            
            color: var(--text-tertiary);
            word-spacing: 0.15em;
            
            /* 段落间距充足 */
            margin-bottom: var(--space-lg);
            
            /* 在 Mac/iOS 上启用连字符 */
            -webkit-hyphens: auto;
            hyphens: auto;
        }
        
        /* ============================================
           高对比度优化和无障碍
           ============================================ */
        @media (prefers-contrast: more) {
            body {
                letter-spacing: 0.02em;
            }
            h1, h2, h3, .typography-hero-mega, .typography-display {
                font-weight: 800;
            }
        }
        
        /* 减少运动模式（prefers-reduced-motion） */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            
            .section-title::after,
            .section-smooth {
                animation: none !important;
            }
        }
        
        /* 移动端简化 */
        @media (max-width: 768px) {
            /* 禁用移动端复杂背景滤镜 */
            .deco-blob {
                display: none !important;
            }
            
            /* 简化玻璃拟态效果 */
            .glass, .glass-strong {
                backdrop-filter: none;
                background: rgba(30, 41, 59, 0.5) !important;
            }
        }
        
        /* Video Modal */
        .video-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            animation: modalFadeIn 0.3s ease;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .video-modal-container {
            position: relative;
            width: 100%;
            max-width: min(90vw, 1200px);
            max-height: 90vh;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            animation: modalSlideIn 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes modalSlideIn {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .video-modal-video {
            width: 100%;
            height: 100%;
            max-height: 90vh;
            display: block;
            cursor: pointer;
            object-fit: contain;
            position: relative;
            z-index: 1;
        }
        .video-modal-close {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
        }
        .video-modal-close:hover { background: rgba(255,255,255,0.25); transform: scale(1.08); }
        .video-modal-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 3rem 1rem 0.75rem;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 15;
        }
        .video-modal-controls.visible { opacity: 1; }
        .video-modal-controls button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 0.25rem;
            opacity: 0.9;
            transition: opacity 0.2s, transform 0.15s;
            min-width: 36px;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        .video-modal-controls button:hover { opacity: 1; transform: scale(1.1); }
        .video-modal-controls button:active { transform: scale(0.95); }
        .video-modal-progress {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: height 0.15s;
        }
        .video-modal-progress:hover { height: 7px; }
        .video-modal-progress-buffer {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            transition: width 0.3s;
            z-index: 1;
        }
        .video-modal-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #06B6D4, #8B5CF6);
            border-radius: 3px;
            transition: width 0.05s linear;
            position: relative;
            z-index: 2;
        }
        .video-modal-progress-fill::after {
            content: '';
            position: absolute;
            right: -5px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0,0,0,0.4);
            opacity: 0;
            transition: opacity 0.15s;
        }
        .video-modal-progress:hover .video-modal-progress-fill::after { opacity: 1; }
        .video-modal-time {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.85);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            font-family: 'Manrope', monospace;
        }
        .video-modal-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.7);
            z-index: 5;
            pointer-events: none;
        }
        /* Top thin progress bar (YouTube style) */
        .video-top-progress {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255,255,255,0.2);
            z-index: 15;
            transition: opacity 0.3s;
        }
        .video-top-progress:hover {
            height: 5px;
        }
        .video-top-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #06B6D4, #8B5CF6);
            transition: width 0.1s;
            position: relative;
            z-index: 2;
        }
        .video-top-progress-buffer {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgba(255,255,255,0.15);
            transition: width 0.3s;
            z-index: 1;
        }
        .video-modal-spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #06B6D4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .video-modal-bigplay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 4;
        }
        .video-modal-bigplay-btn {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: rgba(6, 182, 212, 0.9);
            color: white;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-left: 4px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(6,182,212,0.4);
        }
        .video-modal-bigplay:hover .video-modal-bigplay-btn {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(6,182,212,0.6);
        }
        
        /* Mobile: fullscreen modal */
        @media (max-width: 768px) {
            .video-modal-overlay {
                padding: 0;
                align-items: center;
            }
            .video-modal-container {
                max-width: 100%;
                max-height: 100vh;
                border-radius: 0;
            }
            .video-modal-controls {
                opacity: 1 !important;
                padding: 2.5rem 0.6rem 0.6rem;
                gap: 0.4rem;
                background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.5) 70%, transparent 100%);
                padding-bottom: max(0.6rem, env(safe-area-inset-bottom));
            }
            .video-modal-controls button {
                min-width: 44px;
                min-height: 44px;
                padding: 0;
            }
            .video-modal-close {
                top: 0.5rem;
                right: 0.5rem;
                width: 40px;
                height: 40px;
            }
            .video-modal-bigplay-btn {
                width: 72px;
                height: 72px;
            }
            .video-modal-progress {
                height: 5px;
                flex: 1;
                min-width: 0;
            }
            .video-modal-time {
                font-size: 0.65rem;
                white-space: nowrap;
            }
            .video-top-progress {
                height: 3px;
            }
        }
        
        /* Touch devices: always show video first frame */
        @media (hover: none) {
            .video-modal-controls {
                opacity: 1;
            }
        }
        
        /* ============================================
           LOADING SCREEN
           ============================================ */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0F172A 0%, #1a2847 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            overflow: hidden;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            inset: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #3B82F6;
            border-radius: 50%;
            opacity: 0.5;
            animation: float-particle 6s infinite;
            will-change: transform;
        }

        @keyframes float-particle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(59, 130, 246, 0.1);
            border-top-color: #3B82F6;
            border-right-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 2s linear infinite;
            position: relative;
            z-index: 10;
            /* 性能优化：移除昂贵的 box-shadow */
            will-change: transform;
        }

        .loading-text {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(148, 163, 184, 0.7);
            letter-spacing: 2px;
            opacity: 0;
            animation: fade-in-out 2s ease-in-out infinite;
        }

        @keyframes fade-in-out {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes shimmer {
            0% {
                backgroundPosition: -200% 0;
            }
            100% {
                backgroundPosition: 200% 0;
            }
        }
        
        /* ============================================
           SCROLL PROGRESS INDICATOR
           ============================================ */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #3B82F6, #8B5CF6, #06B6D4);
            transform-origin: left;
            z-index: 10000;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        
        /* ============================================
           CUSTOM SCROLLBAR
           ============================================ */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1E293B;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #3B82F6, #8B5CF6);
            border-radius: 10px;
        }
        
        /* ============================================
           GLASSMORPHISM
           ============================================ */
        .glass {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }
        
        .glass-strong {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(148, 163, 184, 0.15);
        }
        
        /* ============================================
           CUSTOM CURSOR
           ============================================ */
        .cursor {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 2px solid rgba(59, 130, 246, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            mix-blend-mode: difference;
        }
        
        .cursor-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            background: #3B82F6;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
        }
        
        .cursor.hover {
            width: 80px;
            height: 80px;
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(139, 92, 246, 0.8);
        }
        
        .cursor.view::after {
            content: 'VIEW';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        /* ============================================
           GRADIENT TEXT
           ============================================ */
        .gradient-text {
            background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 50%, #06B6D4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% auto;
            animation: gradient-shift 18s ease-in-out infinite;
        }
        
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        /* ============================================
           NEON GLOW
           ============================================ */
        .neon-glow {
            box-shadow: 
                0 0 20px rgba(59, 130, 246, 0.3),
                0 0 40px rgba(139, 92, 246, 0.2),
                0 0 60px rgba(6, 182, 212, 0.1);
        }
        
        .neon-text {
            text-shadow: 
                0 0 10px rgba(59, 130, 246, 0.5),
                0 0 20px rgba(139, 92, 246, 0.3);
        }
        
        /* ============================================
           NOISE OVERLAY
           ============================================ */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9998;
            opacity: 0.5;
        }

        /* ============================================
           DECORATIVE ELEMENTS
           ============================================ */
        .deco-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.15;
            will-change: transform;
        }

        .floating-particles-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-particle {
            position: absolute;
            pointer-events: none;
        }

        .floating-particle-dot {
            width: 2px;
            height: 2px;
            background: radial-gradient(circle, #3B82F6, rgba(59, 130, 246, 0.3));
            border-radius: 50%;
            opacity: 0.4;
            box-shadow: 0 0 4px rgba(59, 130, 246, 0.3);
        }

        @media (max-width: 768px) {
            .floating-particles-bg {
                display: none;
            }
        }

        .deco-line::before {
            content: '';
            position: absolute;
            width: 1px;
            height: 100px;
            background: linear-gradient(180deg, transparent, rgba(59, 130, 246, 0.3), transparent);
            left: 50%;
            transform: translateX(-50%);
        }

        .gradient-divider {
            position: relative;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.5), transparent);
            margin: 60px 0;
        }

        /* ============================================
           SECTION TRANSITIONS
           ============================================ */
        .section-smooth {
            position: relative;
            scroll-margin-top: 96px;
            isolation: isolate;
        }

        .section-smooth::before,
        .section-smooth::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 220px;
            pointer-events: none;
            z-index: 0;
        }

        .section-smooth::before {
            top: -1px;
            background: linear-gradient(to bottom, rgba(6, 11, 24, 1), rgba(15, 23, 42, 0));
        }

        .section-smooth::after {
            bottom: -1px;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0));
        }

        .section-smooth > * {
            position: relative;
            z-index: 1;
        }

        .lamp-core {
            position: absolute;
            top: -44px;
            left: 50%;
            width: 220px;
            height: 92px;
            transform: translateX(-50%);
            border-radius: 999px;
            background: radial-gradient(circle, rgba(125, 211, 252, 0.85) 0%, rgba(34, 211, 238, 0.38) 45%, rgba(34, 211, 238, 0) 100%);
            filter: blur(8px);
            pointer-events: none;
            z-index: 12;
        }

                rgba(103, 232, 249, 0.42) 0%,

            );

            filter: blur(1px);

            pointer-events: none;

        }

        .lamp-focus {

            border-radius: 999px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.34) 0%, rgba(34, 211, 238, 0.18) 40%, rgba(15, 23, 42, 0) 76%);

        @media (max-width: 768px) {

                top: -54px;

            .lamp-cone {

                height: 320px;
            }
        }

        .hero-transition::before,
        .hero-transition::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            pointer-events: none;
            z-index: 2;
        }

        .hero-transition::before {
            top: 0;
            height: 320px;
            background: linear-gradient(to bottom, rgba(4, 9, 21, 1), rgba(8, 15, 30, 0.92) 42%, rgba(15, 23, 42, 0));
        }

        .hero-transition::after {
            bottom: 0;
            height: 220px;
            background: linear-gradient(to top, rgba(15, 23, 42, 1), rgba(15, 23, 42, 0));
        }

        /* ============================================
           ENHANCED ANIMATIONS
           ============================================ */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        @keyframes glow-pulse {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.3), 
                           0 0 40px rgba(139, 92, 246, 0.2);
            }
            50% { 
                box-shadow: 0 0 30px rgba(59, 130, 246, 0.5),
                           0 0 60px rgba(139, 92, 246, 0.3);
            }
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.3), 0 0 40px rgba(139, 92, 246, 0.2);
            }
            50% {
                box-shadow: 0 0 30px rgba(59, 130, 246, 0.5), 0 0 60px rgba(139, 92, 246, 0.3);

            }

            100% {
                opacity: 1;

            }

                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================
           CYBERPUNK THEMED ANIMATIONS
           ============================================ */
        @keyframes float-orb-purple {
            0% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(50px, -80px) scale(1.1);

                transform: translate(100px, 0) scale(1);

                transform: translate(50px, 80px) scale(1.15);
            }

                transform: translate(0, 0) scale(1);

                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(-60px, 70px) scale(1.15);
            }
            50% {
                transform: translate(-80px, 0) scale(1);
            }
            75% {
                transform: translate(-40px, -70px) scale(1.1);
            }
            100% {
                transform: translate(0, 0) scale(1);
            }
        }

        @keyframes scroll-down-bounce {
            0%, 100% {
                transform: translateY(0);
                opacity: 1;
            }
            50% {
                transform: translateY(8px);
                opacity: 0.7;
            }

                box-shadow: 
                    0 0 20px rgba(139, 92, 246, 0.6),

            }
            50% {
                box-shadow:

                    0 0 60px rgba(139, 92, 246, 0.5),

        // ============================================

        // Loading Hook with Particles - 优化版
        function usePageLoading() {
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                // Generate particles for loading screen - 减少数量提升性能
                const particlesContainer = document.getElementById('loadingParticles');
                if (particlesContainer) {
                    // 检测设备性能，移动端减少粒子数量
                    const isMobile = window.innerWidth < 768;
                    const particleCount = isMobile ? 6 : 12;

                    for (let i = 0; i < particleCount; i++) {
                        const particle = document.createElement('div');
                        particle.className = 'particle';
                        const size = Math.random() * 2 + 1;
                        const x = Math.random() * window.innerWidth;
                        const y = Math.random() * window.innerHeight;
                        const tx = (Math.random() - 0.5) * 100;
                        const ty = (Math.random() - 0.5) * 100;
                        const duration = Math.random() * 1.5 + 1.5;
                        const delay = Math.random() * 0.2;

                        particle.style.left = x + 'px';
                        particle.style.top = y + 'px';
                        particle.style.width = size + 'px';
                        particle.style.height = size + 'px';
                        particle.style.setProperty('--tx', tx + 'px');
                        particle.style.setProperty('--ty', ty + 'px');
                        particle.style.animationDuration = duration + 's';
                        particle.style.animationDelay = delay + 's';

                        particlesContainer.appendChild(particle);
                    }
                }

                const timer = setTimeout(() => {
                    setLoading(false);
                    document.getElementById('loadingScreen')?.classList.add('hidden');
                }, 800); // 从 1200ms 降到 800ms，提升首屏反馈速度

                return () => clearTimeout(timer);
            }, []);

            return loading;
        }
        
        // Scroll Progress Hook
        function useScrollProgress() {
            useEffect(() => {
                const progressBar = document.getElementById('scrollProgress');
                if (!progressBar) return;
                
                let ticking = false;
                const updateProgress = () => {
                    if (!ticking) {
                        window.requestAnimationFrame(() => {
                            const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
                            const scrolled = window.scrollY;
                            const progress = (scrolled / scrollHeight) * 100;
                            progressBar.style.width = progress + '%';
                            ticking = false;
                        });
                        ticking = true;
                    }
                };
                
                window.addEventListener('scroll', updateProgress, { passive: true });
                return () => window.removeEventListener('scroll', updateProgress);
            }, []);
        }

        // Floating Background Particles Hook - 优化版
        function useFloatingParticles() {
            useEffect(() => {
                const container = document.getElementById('floatingParticlesBg');
                if (!container || window.innerWidth < 768) return;

                // 减少粒子数量，采用更合理的计算方式
                const particleCount = Math.min(12, Math.floor(window.innerWidth / 150));

                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'floating-particle';

                    const x = Math.random() * 100;
                    const y = Math.random() * 100;
                    const duration = Math.random() * 6 + 10;
                    const delay = Math.random() * 1.5;

                    particle.style.left = x + '%';
                    particle.style.top = y + '%';

                    const dot = document.createElement('div');
                    dot.className = 'floating-particle-dot';
                    dot.style.animation = `float ${duration}s ease-in-out ${delay}s infinite`;

                    particle.appendChild(dot);
                    container.appendChild(particle);
                }

                // Animation keyframe for floating - 简化动画计算
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes float {
                        0%, 100% {
                            transform: translateY(0px);
                            opacity: 0.3;
                        }
                        50% {
                            transform: translateY(-40px);
                            opacity: 0.5;
                        }
                    }
                `;
                document.head.appendChild(style);
            }, []);
        }
        
        // Enhanced Custom Cursor with Throttling & Mobile Detection
        function useCustomCursor() {
            useEffect(() => {
                // Disable custom cursor on mobile devices
                const isMobile = window.innerWidth < 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                if (isMobile) {
                    return;
                }
                
                const cursor = document.querySelector('.cursor');
                const cursorDot = document.querySelector('.cursor-dot');
                
                if (!cursor || !cursorDot) return;
                
                let mouseX = 0;
                let mouseY = 0;
                let cursorX = 0;
                let cursorY = 0;
                let dotX = 0;
                let dotY = 0;
                let isMoving = false;
                
                const animateCursor = () => {
                    if (isMoving) {
                        cursorX += (mouseX - cursorX) * 0.15;
                        cursorY += (mouseY - cursorY) * 0.15;
                        dotX += (mouseX - dotX) * 0.25;
                        dotY += (mouseY - dotY) * 0.25;
                        
                        cursor.style.left = cursorX + 'px';
                        cursor.style.top = cursorY + 'px';
                        cursorDot.style.left = dotX + 'px';
                        cursorDot.style.top = dotY + 'px';
                        
                        isMoving = false;
                    }
                    requestAnimationFrame(animateCursor);
                };
                
                animateCursor();
                
                const moveCursor = (e) => {
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                    isMoving = true;
                };
                
                const handleHover = (e) => {
                    cursor.classList.add('hover');
                    if (e.target.classList.contains('project-image')) {
                        cursor.classList.add('view');
                    }
                };
                
                const handleLeave = () => {
                    cursor.classList.remove('hover', 'view');
                };
                
                window.addEventListener('mousemove', moveCursor, { passive: true });
                
                const hoverElements = document.querySelectorAll('a, button, .hoverable, .project-image');
                hoverElements.forEach(el => {
                    el.addEventListener('mouseenter', handleHover);
                    el.addEventListener('mouseleave', handleLeave);
                });
                
                return () => {
                    window.removeEventListener('mousemove', moveCursor);
                };
            }, []);

        function HoverButton({ className = "", children, style, ...props }) {
            const buttonRef = useRef(null);
            const [isListening, setIsListening] = useState(false);
            const [circles, setCircles] = useState([]);
            const lastAddedRef = useRef(0);

            const createCircle = useCallback((x, y) => {
                const buttonWidth = buttonRef.current?.offsetWidth || 1;
                const xPos = x / buttonWidth;
                const color = `linear-gradient(to right, var(--circle-start) ${xPos * 100}%, var(--circle-end) ${xPos * 100}%)`;

                setCircles((prev) => [
                    ...prev,
                    { id: Date.now() + Math.random(), x, y, color, fadeState: null },
                ]);
            }, []);

            const handlePointerMove = useCallback(
                (event) => {
                    if (!isListening) return;

                    const currentTime = Date.now();
                    if (currentTime - lastAddedRef.current > 100) {
                        lastAddedRef.current = currentTime;
                        const rect = event.currentTarget.getBoundingClientRect();
                        const x = event.clientX - rect.left;
                        const y = event.clientY - rect.top;
                        createCircle(x, y);
                    }
                },
                [isListening, createCircle]
            );

            useEffect(() => {
                circles.forEach((circle) => {
                    if (!circle.fadeState) {
                        setTimeout(() => {
                            setCircles((prev) =>
                                prev.map((c) =>
                                    c.id === circle.id ? { ...c, fadeState: "in" } : c
                                )
                            );
                        }, 0);

                        setTimeout(() => {
                            setCircles((prev) =>
                                prev.map((c) =>
                                    c.id === circle.id ? { ...c, fadeState: "out" } : c
                                )
                            );
                        }, 1000);

                        setTimeout(() => {
                            setCircles((prev) => prev.filter((c) => c.id !== circle.id));
                        }, 2200);
                    }
                });
            }, [circles]);

            return (
                <button
                    ref={buttonRef}
                    className={cn(
                        "hover-button relative isolate px-8 py-3 rounded-3xl",
                        "text-foreground font-medium text-base leading-6",
                        "backdrop-blur-lg bg-[rgba(43,55,80,0.1)]",
                        "cursor-pointer overflow-hidden",
                        "before:content-[''] before:absolute before:inset-0 before:rounded-[inherit] before:pointer-events-none before:z-[0]",
                        "before:shadow-[inset_0_0_0_1px_rgba(170,202,255,0.2),inset_0_0_16px_0_rgba(170,202,255,0.1),inset_0_-3px_12px_0_rgba(170,202,255,0.15),0_1px_3px_0_rgba(0,0,0,0.50),0_4px_12px_0_rgba(0,0,0,0.45)]",
                        "before:mix-blend-multiply before:transition-transform before:duration-300 active:before:scale-[0.975]",
                        className
                    )}
                    onPointerMove={handlePointerMove}
                    onPointerEnter={() => setIsListening(true)}
                    onPointerLeave={() => setIsListening(false)}
                    {...props}
                    style={{
                        "--circle-start": "var(--tw-gradient-from, #a0d9f8)",
                        "--circle-end": "var(--tw-gradient-to, #3a5bbf)",
                        ...style,
                    }}
                >
                    {circles.map(({ id, x, y, color, fadeState }) => (
                        <div
                            key={id}
                            className={cn(
                                "absolute w-3 h-3 -translate-x-1/2 -translate-y-1/2 rounded-full blur-lg pointer-events-none z-[1] transition-opacity duration-300",
                                fadeState === "in" && "opacity-75",
                                fadeState === "out" && "opacity-0 duration-[1.2s]",
                                !fadeState && "opacity-0"
                            )}
                            style={{
                                left: x,
                                top: y,
                                background: color,
                            }}
                        />
                    ))}
                    <span className="relative z-[2]">{children}</span>
                </button>
            );
        }

        // 网络连接检测和性能优化
        const useNetworkStatus = () => {
            const [effectiveType, setEffectiveType] = useState('4g');
            const [isOnline, setIsOnline] = useState(true);
            
            useEffect(() => {
                const updateNetworkStatus = () => {
                    // 检查网络连接
                    setIsOnline(navigator.onLine);
                    
                    // 检查网络类型（如果支持 Network Information API）
                    if (navigator.connection) {
                        setEffectiveType(navigator.connection.effectiveType || '4g');
                    }
                };
                
                updateNetworkStatus();
                window.addEventListener('online', updateNetworkStatus);
                window.addEventListener('offline', updateNetworkStatus);
                
                if (navigator.connection) {
                    navigator.connection.addEventListener('change', updateNetworkStatus);
                }
                
                return () => {
                    window.removeEventListener('online', updateNetworkStatus);
                    window.removeEventListener('offline', updateNetworkStatus);
                    if (navigator.connection) {
                        navigator.connection.removeEventListener('change', updateNetworkStatus);
                    }
                };
            }, []);
            
            return { effectiveType, isOnline };
        };
        
        // Enhanced Project Card with 3D Tilt
        function ProjectCard({ project, index, reverse, onVideoClick }) {
            const ref = useRef(null);
            const cardRef = useRef(null);
            const videoRef = useRef(null);
            const isInView = useInView(ref, { once: true, margin: "-15%" });
            
            const [tilt, setTilt] = useState({ x: 0, y: 0 });
            const [isMobile, setIsMobile] = useState(false);
            const [isTouchDevice, setIsTouchDevice] = useState(false);
            const [showVideo, setShowVideo] = useState(false);
            const [videoLoading, setVideoLoading] = useState(false);
            const [videoError, setVideoError] = useState(false);
            const hoverTimeoutRef = useRef(null);
            const canPlayRef = useRef(false);
            
            // 获取网络状态
            const { effectiveType, isOnline } = useNetworkStatus();
            
            // 是否应该加载视频（基于网络状况）
            const shouldLoadVideo = useMemo(() => {
                if (!isOnline) return false;
                // 在慢速网络（2g/3g）下跳过初次加载
                if (effectiveType === '2g' || effectiveType === '3g') return false;
                return true;
            }, [effectiveType, isOnline]);
            
            // 检测设备类型和视口大小
            useEffect(() => {
                const checkMobile = () => setIsMobile(window.innerWidth < 768);
                const checkTouchDevice = () => setIsTouchDevice(() => {
                    return (('ontouchstart' in window) ||
                            (navigator.maxTouchPoints > 0) ||
                            (navigator.msMaxTouchPoints > 0));
                });
                
                checkMobile();
                checkTouchDevice();
                window.addEventListener('resize', checkMobile);
                return () => {
                    window.removeEventListener('resize', checkMobile);
                    if (hoverTimeoutRef.current) {
                        clearTimeout(hoverTimeoutRef.current);
                    }
                };
            }, []);
            
            const { scrollYProgress } = useScroll({
                target: ref,
                offset: ["start end", "end start"]
            });
            
            const imageY = useTransform(scrollYProgress, [0, 1], [100, -100]);
            const imageScale = useTransform(scrollYProgress, [0, 0.5, 1], [1.1, 1, 1.1]);
            
            const handleMouseMove = useCallback((e) => {
                if (!cardRef.current) return;
                
                const rect = cardRef.current.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const tiltX = ((y - centerY) / centerY) * -10;
                const tiltY = ((x - centerX) / centerX) * 10;
                
                setTilt({ x: tiltX, y: tiltY });
            }, []);
            
            // 视频加载完成处理
            const handleVideoCanPlay = useCallback(() => {
                setVideoLoading(false);
                canPlayRef.current = true;
                // 更新 showVideo 以触发视频播放
                if (videoRef.current && showVideo) {
                    videoRef.current.play().catch(err => {
                        console.warn('Video autoplay failed:', err);
                        setVideoError(true);
                    });
                }
            }, [showVideo]);
            
            // 视频错误处理
            const handleVideoError = useCallback(() => {
                console.warn(`Video failed to load: preview-${project.id}.mp4`);
                setVideoLoading(false);
                setVideoError(true);
                setShowVideo(false);
            }, [project.id]);
            
            const handleMouseEnter = useCallback(() => {
                if (isMobile || isTouchDevice || !project.isVideo || !shouldLoadVideo) return;
                
                // 清除之前的延迟
                if (hoverTimeoutRef.current) {
                    clearTimeout(hoverTimeoutRef.current);
                }
                
                // 300ms 后显示视频
                hoverTimeoutRef.current = setTimeout(() => {
                    // 防止错误的视频再次加载
                    if (videoError) return;
                    
                    setShowVideo(true);
                    
                    if (videoRef.current) {
                        // 如果视频已加载，直接播放
                        if (canPlayRef.current) {
                            videoRef.current.play().catch(err => {
                                console.warn('Video play failed:', err);
                                setVideoError(true);
                                setShowVideo(false);
                            });
                        } else {
                            // 否则设置加载状态
                            setVideoLoading(true);
                        }
                    }
                }, 300);
            }, [isMobile, isTouchDevice, project.isVideo, videoError, shouldLoadVideo]);
            
            const handleMouseLeave = useCallback(() => {
                // 清除延迟
                if (hoverTimeoutRef.current) {
                    clearTimeout(hoverTimeoutRef.current);
                }
                
                // 暂停并隐藏视频
                setShowVideo(false);
                if (videoRef.current) {
                    videoRef.current.pause();
                    videoRef.current.currentTime = 0;
                }
                setTilt({ x: 0, y: 0 });
            }, []);
            
            return (

                        onMouseLeave={!isMobile ? handleMouseLeave : undefined}

                            rotateX: tilt.x,
