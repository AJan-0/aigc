        // Main App
        function VideoModal({ project, onClose }) {
            const videoRef = React.useRef(null);
            const [isPlaying, setIsPlaying] = React.useState(false);
            const [progress, setProgress] = React.useState(0);
            const [currentTime, setCurrentTime] = React.useState('0:00');
            const [duration, setDuration] = React.useState('0:00');
            const [isMuted, setIsMuted] = React.useState(false);
            const [showControls, setShowControls] = React.useState(true);
            const [isLoading, setIsLoading] = React.useState(true);
            const [hasError, setHasError] = React.useState(false);
            const [buffered, setBuffered] = React.useState(0);
            const [isMobile, setIsMobile] = React.useState(false);
            const [isFullscreen, setIsFullscreen] = React.useState(false);
            const controlsTimeout = React.useRef(null);
            const touchStartY = React.useRef(0);
            const touchStartX = React.useRef(0);
            const lastTapTime = React.useRef(0);
            const retryCountRef = React.useRef(0);
            const stalledHandledRef = React.useRef(false);

            const formatTime = (s) => {
                if (isNaN(s)) return '0:00';
                const m = Math.floor(s / 60);
                const sec = Math.floor(s % 60);
                return m + ':' + String(sec).padStart(2, '0');
            };

            const resetControlsTimeout = () => {
                setShowControls(true);
                if (controlsTimeout.current) clearTimeout(controlsTimeout.current);
                controlsTimeout.current = setTimeout(() => {
                    if (isPlaying) setShowControls(false);
                }, 3000);
            };

            React.useEffect(() => {
                const mobile = window.innerWidth < 768 || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
                setIsMobile(mobile);
                const handleKey = (e) => {
                    if (e.key === 'Escape') onClose();
                    if (!videoRef.current) return;
                    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
                    if (e.key === 'ArrowLeft') videoRef.current.currentTime = Math.max(0, videoRef.current.currentTime - 5);
                    if (e.key === 'ArrowRight') videoRef.current.currentTime = Math.min(videoRef.current.duration, videoRef.current.currentTime + 5);
                    if (e.key === 'm' || e.key === 'M') toggleMute();
                    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
                };
                const handleFullscreenChange = () => {
                    setIsFullscreen(!!document.fullscreenElement);
                };
                document.addEventListener('keydown', handleKey);
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                document.body.style.overflow = 'hidden';
                document.body.style.position = 'fixed';
                document.body.style.width = '100%';
                return () => {
                    document.removeEventListener('keydown', handleKey);
                    document.removeEventListener('fullscreenchange', handleFullscreenChange);
                    document.body.style.overflow = '';
                    document.body.style.position = '';
                    document.body.style.width = '';
                };
            }, []);

            React.useEffect(() => {
                if (videoRef.current) {
                    const v = videoRef.current;
                    v.pause();
                    v.currentTime = 0;
                    setIsPlaying(false);
                    const loadingTimeout = setTimeout(() => setIsLoading(false), 3000);
                    return () => clearTimeout(loadingTimeout);
                }
            }, []);

            const togglePlay = () => {
                if (!videoRef.current) return;
                const v = videoRef.current;
                if (v.paused) {
                    v.muted = false;
                    v.play().then(() => {
                        setIsPlaying(true);
                        setIsMuted(false);
                        resetControlsTimeout();
                    }).catch((err) => {
                        console.error('Play failed:', err);
                        v.muted = true;
                        v.play().then(() => {
                            setIsPlaying(true);
                            setIsMuted(true);
                        }).catch(() => setIsPlaying(false));
                    });
                } else {
                    v.pause();
                    setIsPlaying(false);
                    setShowControls(true);
                }
            };

            const toggleMute = () => {
                if (!videoRef.current) return;
                videoRef.current.muted = !videoRef.current.muted;
                setIsMuted(videoRef.current.muted);
            };

            const toggleFullscreen = () => {
                const el = document.getElementById('videoModalWrapper');
                if (!el) return;
                if (document.fullscreenElement) document.exitFullscreen();
                else el.requestFullscreen().catch(() => {});
            };

            const seekTo = (e) => {
                if (!videoRef.current) return;
                const rect = e.currentTarget.getBoundingClientRect();
                const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                videoRef.current.currentTime = pct * videoRef.current.duration;
            };

            // Touch handlers
            const handleTouchStart = (e) => {
                touchStartY.current = e.touches[0].clientY;
                touchStartX.current = e.touches[0].clientX;
            };

            const handleTouchEnd = (e) => {
                const dy = e.changedTouches[0].clientY - touchStartY.current;
                const dx = e.changedTouches[0].clientX - touchStartX.current;
                // Swipe down to close (only when not in fullscreen)
                if (dy > 100 && Math.abs(dx) < 50 && !isFullscreen) {
                    onClose();
                    return;
                }
                // Tap to toggle controls (only on video area, not controls)
                if (Math.abs(dy) < 10 && Math.abs(dx) < 10) {
                    const now = Date.now();
                    if (now - lastTapTime.current < 300) {
                        // Double tap = toggle fullscreen
                        toggleFullscreen();
                        lastTapTime.current = 0;
                    } else {
                        lastTapTime.current = now;
                        // Single tap = toggle controls (with delay to detect double tap)
                        setTimeout(() => {
                            if (lastTapTime.current !== 0) {
                                resetControlsTimeout();
                            }
                        }, 300);
                    }
                }
            };

            const handleMouseMove = () => resetControlsTimeout();

            return (
                <div
                    className="video-modal-overlay"
                    onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
                    onMouseMove={handleMouseMove}
                    onTouchStart={handleTouchStart}
                    onTouchEnd={handleTouchEnd}
                >
                    <div className="video-modal-container" id="videoModalWrapper">
                        {/* Top thin progress bar — always visible */}
                        <div className="video-top-progress" style={{opacity: showControls || !isPlaying ? 1 : 0}}>
                            <div className="video-top-progress-buffer" style={{width: buffered + '%'}} />
                            <div className="video-top-progress-fill" style={{width: progress + '%'}} />
                        </div>

                        {/* Loading spinner */}
                        {isLoading && (
                            <div className="video-modal-loading">
                                <div className="video-modal-spinner"></div>
                                <p style={{color: '#94a3b8', textAlign: 'center', marginTop: '12px', fontSize: '14px'}}>加载中...</p>
                            </div>
                        )}

                        {/* Error state */}
                        {hasError && (
                            <div className="video-modal-loading">
                                <p style={{color: '#94a3b8', textAlign: 'center'}}>视频加载失败<br/><small>请检查网络连接</small></p>
                                <button 
                                    onClick={() => { setHasError(false); setIsLoading(true); retryCountRef.current = 0; if (videoRef.current) videoRef.current.load(); }}
                                    style={{marginTop: '12px', padding: '10px 28px', background: 'linear-gradient(135deg, #3B82F6, #8B5CF6)', color: 'white', border: 'none', borderRadius: '8px', cursor: 'pointer', fontSize: '14px', fontWeight: 500}}
                                >重试</button>
                            </div>
                        )}

                        {/* Video element */}
                        <video
                            ref={videoRef}
                            src={project.videoUrl}
                            poster={project.image}
                            className="video-modal-video"
                            playsInline
                            preload="auto"
                            autoPlay={false}
                            muted={false}
                            onClick={isMobile ? undefined : togglePlay}
                            onLoadStart={() => setIsLoading(true)}
                            onWaiting={() => setIsLoading(true)}
                            onPlaying={() => { setIsLoading(false); setIsPlaying(true); }}
                            onCanPlay={() => setIsLoading(false)}
                            onCanPlayThrough={() => setIsLoading(false)}
                            onLoadedData={() => setIsLoading(false)}
                            onLoadedMetadata={() => setIsLoading(false)}
                            onError={(e) => {
                                const err = e.target.error;
                                console.error('Video error:', err ? err.code : 'unknown', err ? err.message : '');
                                if (err && (err.code === 2 || err.code === 3) && retryCountRef.current < 3) {
                                    retryCountRef.current++;
                                    setTimeout(() => { if (videoRef.current) videoRef.current.load(); }, 1000 * retryCountRef.current);
                                } else {
                                    setIsLoading(false);
                                    setHasError(true);
                                }
                            }}
                            onStalled={() => {
                                if (!stalledHandledRef.current) {
                                    stalledHandledRef.current = true;
                                    if (videoRef.current) videoRef.current.load();
                                    setTimeout(() => { stalledHandledRef.current = false; }, 5000);
                                }
                            }}
                            onProgress={() => {
                                if (videoRef.current && videoRef.current.buffered.length > 0) {
                                    const bufferedEnd = videoRef.current.buffered.end(videoRef.current.buffered.length - 1);
                                    const dur = videoRef.current.duration;
                                    if (dur > 0) setBuffered(Math.round((bufferedEnd / dur) * 100));
                                }
                            }}
                            onTimeUpdate={() => {
                                if (!videoRef.current) return;
                                setProgress((videoRef.current.currentTime / videoRef.current.duration) * 100);
                                setCurrentTime(formatTime(videoRef.current.currentTime));
                            }}
                            onLoadedMetadata={() => {
                                if (videoRef.current) setDuration(formatTime(videoRef.current.duration));
                            }}
                            onEnded={() => { setIsPlaying(false); setShowControls(true); }}
                        />

                        {/* Center play button (visible when paused) */}
                        {!isPlaying && !hasError && (
                            <div className="video-modal-bigplay" onClick={togglePlay} style={{zIndex: 10}}>
                                <div className="video-modal-bigplay-btn">
                                    <svg width="28" height="28" viewBox="0 0 24 24" fill="white">
                                        <path d="M8 5v14l11-7z"/>
                                    </svg>
                                </div>
                            </div>
                        )}

                        {/* Close button */}
                        <button className="video-modal-close" onClick={onClose} title="关闭">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>

                        {/* Bottom controls bar */}
                        <div className={`video-modal-controls ${showControls || !isPlaying ? 'visible' : ''}`}>
                            <button onClick={togglePlay} title={isPlaying ? '暂停' : '播放'}>
                                {isPlaying ? (
                                    <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
                                        <rect x="6" y="4" width="4" height="16" rx="1"/>
                                        <rect x="14" y="4" width="4" height="16" rx="1"/>
                                    </svg>
                                ) : (
                                    <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
                                        <path d="M8 5v14l11-7z"/>
                                    </svg>
                                )}
                            </button>

                            <span className="video-modal-time">{currentTime}</span>

                            <div className="video-modal-progress" onClick={seekTo}>
                                <div className="video-modal-progress-buffer" style={{width: buffered + '%'}} />
                                <div className="video-modal-progress-fill" style={{width: progress + '%'}} />
                            </div>

                            <span className="video-modal-time">{duration}</span>

                            <button onClick={toggleMute} title={isMuted ? '取消静音' : '静音'}>
                                {isMuted ? (
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
                                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                                        <line x1="23" y1="9" x2="17" y2="15"/>
                                        <line x1="17" y1="9" x2="23" y2="15"/>
                                    </svg>
                                ) : (
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
                                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                                    </svg>
                                )}
                            </button>

                            <button onClick={toggleFullscreen} title={isFullscreen ? '退出全屏' : '全屏'}>
                                {isFullscreen ? (
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
                                        <path d="M8 3v3a2 2 0 0 1-2 2H3"/>
                                        <path d="M21 8h-3a2 2 0 0 1-2-2V3"/>
                                        <path d="M3 16h3a2 2 0 0 1 2 2v3"/>
                                        <path d="M16 21v-3a2 2 0 0 1 2-2h3"/>
                                    </svg>
                                ) : (
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
                                        <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
                                        <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
                                        <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
                                        <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
                                    </svg>
                                )}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {

            const [projectsLoading, setProjectsLoading] = React.useState(true);

            useScrollProgress();
            useCustomCursor();
            useFloatingParticles();

            React.useEffect(() => {
                loadProjectsFromAPI().then(data => {
