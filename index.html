<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Poetfolio - AJan 的 AI 影像作品集，呈现 AI 真人短剧、角色一致性与可交付影像工作流。">
    <title>Poetfolio | AJan AI Moving Image Portfolio</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#06B6D4">
    
    <!-- React Ecosystem -->
    <script crossorigin src="vendor/react.production.min.js"></script>
    <script crossorigin src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/framer-motion.js"></script>
    <script src="vendor/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="tailwind.js"></script>
    <script src="vendor/supabase.min.js"></script>
    <script type="module" src="src/config.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Syne', 'sans-serif'],
                        body: ['Manrope', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0F172A',
                        secondary: '#1E293B',
                        'accent-blue': '#3B82F6',
                        'accent-purple': '#8B5CF6',
                        'accent-cyan': '#06B6D4',
                    },
                }
            },
            corePlugins: {
                // 在移动端禁用非必要效果以提升性能
                accessibility: true,
                animation: true,
            }
        }
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        /* ============================================
           高级排版架构 - CSS 变量系统
           ============================================ */
        :root {
            /* 文字颜色梯度系统 - 5 级对比 */
            --text-primary:      #F8FAFC;      /* h1 标题高对比 */
            --text-secondary:    #E2E8F0;      /* h2-h3 标题 */
            --text-tertiary:     #CBD5E1;      /* 正文 */
            --text-quaternary:   #94A3B8;      /* 辅助文本、标签 */
            --text-quinary:      #64748B;      /* 图注、禁用状态 */
            
            /* 强调色系 */
            --accent-primary:    #06B6D4;      /* 青色 - 主交互 */
            --accent-secondary:  #8B5CF6;      /* 紫色 - 次强调 */
            --accent-tertiary:   #3B82F6;      /* 蓝色 - 补充 */
            
            /* 垂直韵律系统（Vertical Rhythm）- 基础单位：8px */
            --space-xs: clamp(0.25rem, 0.5vw, 0.5rem);
            --space-sm: clamp(0.5rem, 1vw, 0.75rem);
            --space-md: clamp(0.75rem, 1.5vw, 1rem);
            --space-lg: clamp(1rem, 2vw, 1.5rem);
            --space-xl: clamp(1.5rem, 3vw, 2rem);
            --space-2xl: clamp(2rem, 4vw, 2.5rem);
            --space-3xl: clamp(2.5rem, 5vw, 3rem);
            --space-4xl: clamp(3rem, 6vw, 4rem);
            --space-5xl: clamp(4rem, 8vw, 5rem);
            
            /* 行高比例 */
            --lh-tight: 1;
            --lh-snug: 1.1;
            --lh-normal: 1.5;
            --lh-relaxed: 1.75;
            --lh-loose: 2;
        }
        
        body {
            font-family: 'Manrope', sans-serif;
            background: linear-gradient(180deg, #040915 0%, #0A1327 34%, #0F172A 72%, #0F172A 100%);
            color: var(--text-tertiary);
            overflow-x: hidden;
            cursor: none;
            /* 性能优化：启用 GPU 加速 */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* 字体大小和行高 */
            font-size: clamp(0.95rem, 1vw, 1.125rem);
            font-weight: 400;
            line-height: var(--lh-relaxed);
            letter-spacing: 0.002em;
            word-spacing: 0.1em;
        }
        
        /* 性能优化：减少重绘 */
        .will-change-gpu {
            will-change: transform;
            transform: translateZ(0);
        }
        
        /* 性能优化：内容可见性，非关键内容延迟渲染 */
        @supports (content-visibility: auto) {
            .project-card-mobile,
            .feature-card-mobile {
                content-visibility: auto;
                contain-intrinsic-size: auto 400px;
            }
        }
        
        /* 性能优化：首屏 Hero 区域 GPU 加速 */
        section:first-of-type {
            contain: layout style paint;
            will-change: transform;
        }
        
        /* 性能优化：Framer Motion 元素 GPU 加速 */
        [role="heading"],
        h1, h2, h3, h4, h5, h6 {
            will-change: transform;
        }
        
        /* ============================================
           8 级高级字体系统
           ============================================ */
        
        /* Hero Massive Title - 页面主标题 */
        .typography-hero-mega,
        .hero-title-mega {
            font-size: clamp(2.5rem, 4.5vw + 0.5rem, 4.5rem);
            font-weight: 800;
            line-height: var(--lh-tight);
            letter-spacing: -0.03em;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-secondary) 0%, var(--accent-primary) 50%, var(--accent-tertiary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 4px rgba(139, 92, 246, 0.2));
        }
        
        /* Display Heading - 重要章节 */
        h1, .text-7xl, .font-display,
        .typography-display,
        .section-heading-primary {
            font-size: clamp(1.875rem, 3.5vw, 3.25rem);
            font-weight: 700;
            line-height: var(--lh-snug);
            letter-spacing: -0.015em;
            color: var(--text-primary);
        }
        
        /* Heading Secondary - 中等标题 */
        h2, .text-6xl,
        .typography-heading,
        .section-heading-secondary {
            font-size: clamp(1.5rem, 2.5vw + 0.3rem, 2.5rem);
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.01em;
            color: var(--text-secondary);
        }
        
        /* Heading Tertiary - 次级标题 */
        h3, .text-5xl,
        .typography-subheading,
        .section-heading-tertiary {
            font-size: clamp(1.25rem, 2vw + 0.2rem, 2rem);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.005em;
            color: var(--text-secondary);
        }
        
        /* Heading Quaternary */
        h4, .text-4xl,
        .typography-h4 {
            font-size: clamp(1.1rem, 1.5vw, 1.5rem);
            font-weight: 600;
            line-height: 1.25;
            letter-spacing: 0em;
            color: var(--text-tertiary);
        }
        
        /* Heading Quinary */
        h5, .text-3xl,
        .typography-h5 {
            font-size: clamp(1rem, 1.2vw, 1.25rem);
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: 0.005em;
        }
        
        /* Heading Senary */
        h6, .text-2xl,
        .typography-h6 {
            font-size: clamp(0.95rem, 1.1vw, 1.1rem);
            font-weight: 600;
            line-height: 1.4;
            letter-spacing: 0.01em;
        }
        
        /* Subtitle - heading 下的描述 */
        .typography-subtitle,
        .subtitle,
        .section-subtitle {
            font-size: clamp(1rem, 1.5vw, 1.375rem);
            font-weight: 500;
            line-height: 1.4;
            letter-spacing: 0.015em;
            color: var(--text-tertiary);
            opacity: 0.95;
        }
        
        /* Body Lead - 摘出的开场段落 */
        .typography-lead,
        .lead {
            font-size: clamp(1rem, 1.2vw, 1.25rem);
            font-weight: 500;
            line-height: 1.65;
            letter-spacing: 0.003em;
            color: var(--text-secondary);
        }
        
        /* Regular Body - 正文 */
        p,
        .typography-body,
        .body-text {
            font-size: clamp(0.95rem, 1vw, 1.125rem);
            font-weight: 400;
            line-height: var(--lh-relaxed);
            letter-spacing: 0.002em;
            color: var(--text-tertiary);
            word-spacing: 0.1em;
            margin-bottom: var(--space-lg);
            text-align: justify;
            text-justify: inter-word;
        }
        
        /* Accent Body - 强调内容 */
        .typography-body-accent,
        .body-accent {
            font-size: clamp(0.95rem, 1vw, 1.125rem);
            font-weight: 600;
            line-height: var(--lh-relaxed);
            color: var(--accent-primary);
            background: linear-gradient(135deg, transparent, rgba(6, 182, 212, 0.1));
            padding: 0 0.25em;
            text-decoration: underline 2px rgba(6, 182, 212, 0.4);
            text-decoration-skip-ink: auto;
        }
        
        /* Label / Tag - 标签文本 */
        label, .label-text,
        .typography-label,
        .tag-label {
            font-size: clamp(0.8rem, 0.85vw, 0.95rem);
            font-weight: 600;
            line-height: 1.4;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-quaternary);
        }
        
        /* Caption - 图注 */
        small, .text-sm,
        .typography-caption,
        .caption {
            font-size: clamp(0.75rem, 0.75vw, 0.875rem);
            font-weight: 500;
            line-height: 1.5;
            letter-spacing: 0.02em;
            color: var(--text-quinary);
        }
        
        /* 代码文本 */
        code {
            font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.95em;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 0.25em 0.5em;
            border-radius: 4px;
            color: var(--accent-primary);
            word-break: break-word;
        }
        
        pre {
            font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
            font-size: clamp(0.75rem, 0.85vw, 1rem);
            line-height: 1.5;
        }
        
        pre code {
            padding: 1rem;
            display: block;
            overflow-x: auto;
            background: rgba(15, 23, 42, 0.8);
            border: none;
        }
        
        /* ============================================
           动态排版装饰
           ============================================ */
        
        /* 标题下划线动画 */
        .section-title {
            position: relative;
            display: inline-block;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            border-radius: 2px;
            animation: slide-expand 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        @keyframes slide-expand {
            from {
                width: 0;
                opacity: 0;
            }
            to {
                width: 100%;
                opacity: 1;
            }
        }
        
        /* 段落行高呼吸动画 */
        .text-breathable {
            transition: line-height 0.3s ease;
        }
        
        .text-breathable:hover {
            line-height: var(--lh-loose);
        }
        
        /* 数据强调 - 关键数字放大 */
        .number-highlight {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--accent-primary);
            font-variant-numeric: tabular-nums;
        }
        
        /* 粗体词汇强调 */
        strong {
            font-weight: 700;
            color: var(--accent-secondary);
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(6, 182, 212, 0.1));
            padding: 0 0.25em;
            border-radius: 3px;
            transition: all 0.3s ease;
        }
        
        strong:hover {
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.2);
            transform: scale(1.02);
        }
        
        /* 斜体强调 */
        em {
            font-style: italic;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        /* 标题前的装饰符 */
        .subtitle-accent {
            position: relative;
            color: var(--text-primary);
        }
        
        .subtitle-accent::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 60%;
            background: linear-gradient(180deg, var(--accent-primary) 0%, transparent 100%);
            border-radius: 2px;
        }
        
        /* 可视化引用 (Visual Quote) */
        .blockquote-accent {
            position: relative;
            padding-left: 1.5em;
            color: var(--text-secondary);
            font-style: italic;
            border-left: 3px solid var(--accent-primary);
            margin-left: 0;
            margin-bottom: var(--space-lg);
        }
        
        .blockquote-accent::before {
            content: '"';
            position: absolute;
            left: 0;
            top: -0.3em;
            font-size: 3em;
            color: var(--accent-primary);
            opacity: 0.3;
        }
        
        blockquote {
            border-left: 3px solid var(--accent-primary);
            padding-left: var(--space-lg);
            margin-left: 0;
            margin-bottom: var(--space-lg);
            color: var(--text-secondary);
            font-style: italic;
        }
        
        /* ============================================
           垂直韵律系统（Vertical Rhythm）
           ============================================ */
        
        ul, ol {
            margin: var(--space-lg) 0 var(--space-lg) var(--space-lg);
            line-height: var(--lh-relaxed);
        }
        
        li {
            margin-bottom: var(--space-sm);
        }
        
        /* Section spacing */
        section {
            padding: var(--space-5xl) var(--space-xl);
        }
        
        section + section {
            border-top: 1px solid rgba(148, 163, 184, 0.1);
            margin-top: var(--space-5xl);
        }
        
        /* Heading spacing */
        h1, h2, h3, h4, h5, h6 {
            margin-top: var(--space-2xl);
            margin-bottom: var(--space-md);
            scroll-margin-top: 80px;
        }
        
        h1 {
            margin-top: var(--space-5xl);
            margin-bottom: var(--space-xl);
        }
        
        h2 {
            margin-top: var(--space-4xl);
            margin-bottom: var(--space-lg);
        }
        
        h3 {
            margin-top: var(--space-3xl);
            margin-bottom: var(--space-md);
        }
        
        /* ============================================
           高级排版风格预设 - 3 种风格系统
           ============================================ */
        
        /* 风格 A：极简专业风格（minimal-pro） */
        .style-minimal-pro {
            --text-color: var(--text-secondary);
            --accent-color: var(--accent-primary);
            
            font-size: clamp(0.95rem, 1vw, 1.1rem);
            font-weight: 500;
            line-height: var(--lh-loose);
            letter-spacing: 0.01em;
            color: var(--text-color);
            
            /* 首字母大写 + 小号大写 */
            font-variant-caps: small-caps;
        }
        
        /* 风格 B：气场强势风格（powerful-hero） */
        .style-powerful-hero {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 800;
            line-height: var(--lh-tight);
            letter-spacing: -0.03em;
            text-transform: uppercase;
            
            background: linear-gradient(135deg, 
                var(--accent-secondary) 0%, 
                var(--accent-primary) 50%, 
                var(--accent-tertiary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            
            /* 添加深度感 */
            filter: drop-shadow(0 2px 4px rgba(139, 92, 246, 0.2));
        }
        
        /* 风格 C：优雅叙事风格（narrative-elegant） */
        .style-narrative-elegant {
            font-size: clamp(0.95rem, 1.1vw, 1.2rem);
            font-weight: 400;
            line-height: var(--lh-loose);
            letter-spacing: 0.005em;
            text-align: justify;
            
            color: var(--text-tertiary);
            word-spacing: 0.15em;
            
            /* 段落间距充足 */
            margin-bottom: var(--space-lg);
            
            /* 在 Mac/iOS 上启用连字符 */
            -webkit-hyphens: auto;
            hyphens: auto;
        }
        
        /* ============================================
           高对比度优化和无障碍
           ============================================ */
        @media (prefers-contrast: more) {
            body {
                letter-spacing: 0.02em;
            }
            h1, h2, h3, .typography-hero-mega, .typography-display {
                font-weight: 800;
            }
        }
        
        /* 减少运动模式（prefers-reduced-motion） */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            
            .section-title::after,
            .section-smooth {
                animation: none !important;
            }
        }
        
        /* 移动端简化 */
        @media (max-width: 768px) {
            /* 禁用移动端复杂背景滤镜 */
            .deco-blob {
                display: none !important;
            }
            
            /* 简化玻璃拟态效果 */
            .glass, .glass-strong {
                backdrop-filter: none;
                background: rgba(30, 41, 59, 0.5) !important;
            }
        }
        
        /* Video Modal */
        .video-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            animation: modalFadeIn 0.3s ease;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .video-modal-container {
            position: relative;
            width: 100%;
            max-width: min(90vw, 1200px);
            max-height: 90vh;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            animation: modalSlideIn 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes modalSlideIn {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .video-modal-video {
            width: 100%;
            height: 100%;
            max-height: 90vh;
            display: block;
            cursor: pointer;
            object-fit: contain;
            position: relative;
            z-index: 1;
        }
        .video-modal-close {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
        }
        .video-modal-close:hover { background: rgba(255,255,255,0.25); transform: scale(1.08); }
        .video-modal-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 3rem 1rem 1rem;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 15;
        }
        .video-modal-controls.visible { opacity: 1; }
        .video-modal-controls button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 0.25rem;
            opacity: 0.9;
            transition: opacity 0.2s, transform 0.15s;
            min-width: 36px;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        .video-modal-controls button:hover { opacity: 1; transform: scale(1.1); }
        .video-modal-controls button:active { transform: scale(0.95); }
        .video-modal-progress {
            flex: 1;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            transition: height 0.15s, box-shadow 0.15s;
            /* 扩大点击热区 */
            padding: 8px 0;
            background-clip: content-box;
        }
        .video-modal-progress:hover { height: 12px; box-shadow: 0 0 12px rgba(6,182,212,0.3); }
        .video-modal-progress-buffer {
            position: absolute;
            top: 8px;
            left: 0;
            height: calc(100% - 16px);
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            transition: width 0.3s;
            z-index: 1;
        }
        .video-modal-progress-fill {
            height: calc(100% - 16px);
            top: 8px;
            background: linear-gradient(90deg, #06B6D4, #8B5CF6);
            border-radius: 6px;
            transition: width 0.05s linear;
            position: relative;
            z-index: 2;
        }
        .video-modal-progress-fill::after {
            content: '';
            position: absolute;
            right: -7px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,0,0,0.5), 0 0 0 2px rgba(6,182,212,0.4);
            opacity: 0;
            transition: opacity 0.15s, transform 0.15s;
        }
        .video-modal-progress:hover .video-modal-progress-fill::after { opacity: 1; transform: translateY(-50%) scale(1.1); }
        .video-modal-time {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.85);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            font-family: 'Manrope', monospace;
        }
        .video-modal-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.7);
            z-index: 5;
            pointer-events: none;
        }
        /* Top thin progress bar (YouTube style) */
        .video-top-progress {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: rgba(255,255,255,0.2);
            z-index: 15;
            transition: opacity 0.3s, height 0.2s;
            cursor: pointer;
        }
        .video-top-progress:hover {
            height: 10px;
        }
        .video-top-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #06B6D4, #8B5CF6);
            transition: width 0.1s;
            position: relative;
            z-index: 2;
        }
        .video-top-progress-buffer {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgba(255,255,255,0.15);
            transition: width 0.3s;
            z-index: 1;
        }
        .video-modal-spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #06B6D4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .video-modal-bigplay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 4;
        }
        .video-modal-bigplay-btn {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: rgba(6, 182, 212, 0.9);
            color: white;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-left: 4px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(6,182,212,0.4);
        }
        .video-modal-bigplay:hover .video-modal-bigplay-btn {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(6,182,212,0.6);
        }
        
        /* Mobile: fullscreen modal */
        @media (max-width: 768px) {
            .video-modal-overlay {
                padding: 0;
                align-items: center;
            }
            .video-modal-container {
                max-width: 100%;
                max-height: 100vh;
                border-radius: 0;
            }
            .video-modal-controls {
                opacity: 1 !important;
                padding: 2.5rem 0.6rem 0.6rem;
                gap: 0.3rem;
                flex-wrap: wrap;
                background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.5) 70%, transparent 100%);
                padding-bottom: max(0.6rem, env(safe-area-inset-bottom));
            }
            .video-modal-controls button {
                min-width: 44px;
                min-height: 44px;
                padding: 0;
            }
            .video-modal-close {
                top: 0.5rem;
                right: 0.5rem;
                width: 40px;
                height: 40px;
            }
            .video-modal-bigplay-btn {
                width: 72px;
                height: 72px;
            }
            /* 进度条独立一行，更大更易操作 */
            .video-modal-progress {
                order: 10;
                flex-basis: 100%;
                height: 6px;
                padding: 0;
                margin-top: 6px;
                border-radius: 3px;
                background-clip: border-box;
                position: relative;
            }
            .video-modal-progress::before {
                content: '';
                position: absolute;
                left: 0; right: 0;
                top: -10px; bottom: -10px;
            }
            .video-modal-progress-buffer {
                top: 0;
                height: 100%;
                border-radius: 3px;
            }
            .video-modal-progress-fill {
                top: 0;
                height: 100%;
                border-radius: 3px;
            }
            .video-modal-progress-fill::after {
                width: 14px;
                height: 14px;
                right: -7px;
                opacity: 1;
            }
            .video-modal-time {
                font-size: 0.7rem;
                white-space: nowrap;
            }
            .video-top-progress {
                height: 4px;
            }
            /* 倍速按钮移动端适配 */
            .speed-btn {
                font-size: 0.65rem !important;
                min-width: 36px !important;
                padding: 0.15rem 0.3rem !important;
            }
        }
        
        /* Touch devices: always show video first frame */
        @media (hover: none) {
            .video-modal-controls {
                opacity: 1;
            }
        }
        
        /* ============================================
           LOADING SCREEN
           ============================================ */
        .loading-screen {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 18% 22%, rgba(6, 182, 212, 0.18), transparent 30%),
                radial-gradient(circle at 78% 62%, rgba(139, 92, 246, 0.16), transparent 34%),
                linear-gradient(135deg, #020617 0%, #07111f 48%, #0F172A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            overflow: hidden;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            inset: 0;
            pointer-events: none;
        }

        .loading-panel {
            position: relative;
            z-index: 10;
            width: min(86vw, 520px);
            display: grid;
            gap: 1.2rem;
            padding: 2.25rem;
            border: 1px solid rgba(148, 163, 184, 0.16);
            background: rgba(2, 6, 23, 0.58);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .loading-kicker {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            color: rgba(103, 232, 249, 0.86);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.26em;
            text-transform: uppercase;
        }

        .loading-kicker::before {
            content: '';
            width: 3.5rem;
            height: 1px;
            background: rgba(103, 232, 249, 0.48);
        }

        .loading-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.9rem, 5vw, 3.5rem);
            font-weight: 700;
            line-height: 1.05;
            color: #F8FAFC;
            letter-spacing: 0;
        }

        .loading-status {
            color: rgba(203, 213, 225, 0.74);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .loading-bars {
            display: grid;
            gap: 0.6rem;
            margin-top: 0.2rem;
        }

        .loading-bar {
            height: 2px;
            overflow: hidden;
            background: rgba(148, 163, 184, 0.14);
        }

        .loading-bar::after {
            content: '';
            display: block;
            width: 42%;
            height: 100%;
            background: linear-gradient(90deg, rgba(103, 232, 249, 0), #67E8F9, #A78BFA);
            animation: loading-scan 1.45s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }

        .loading-bar:nth-child(2)::after {
            animation-delay: 0.18s;
        }

        .loading-bar:nth-child(3)::after {
            animation-delay: 0.34s;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #3B82F6;
            border-radius: 50%;
            opacity: 0.5;
            animation: float-particle 6s infinite;
            will-change: transform;
        }

        @keyframes float-particle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        .loading-spinner {
            display: none;
        }

        .loading-text {
            color: rgba(148, 163, 184, 0.72);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        @keyframes fade-in-out {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes loading-scan {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(260%); }
        }

        @keyframes shimmer {
            0% {
                backgroundPosition: -200% 0;
            }
            100% {
                backgroundPosition: 200% 0;
            }
        }

        /* ============================================
           EDITORIAL PORTFOLIO HERO
           ============================================ */
        .film-grain {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            opacity: 0.05;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .portfolio-hero {
            position: relative;
            min-height: 100svh;
            display: grid;
            align-items: end;
            overflow: hidden;
            padding: clamp(7rem, 12vw, 10rem) 1.5rem clamp(3rem, 7vw, 5rem);
            background:
                radial-gradient(circle at 18% 18%, rgba(6, 182, 212, 0.1), transparent 30%),
                linear-gradient(180deg, #020617 0%, #050915 54%, #0F172A 100%);
        }

        .portfolio-hero-grid {
            position: absolute;
            inset: 0;
            opacity: 0.28;
            pointer-events: none;
            background-size: 72px 72px;
            background-image:
                linear-gradient(to right, rgba(148, 163, 184, 0.055) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(148, 163, 184, 0.055) 1px, transparent 1px);
            mask-image: linear-gradient(to bottom, black, transparent 78%);
            -webkit-mask-image: linear-gradient(to bottom, black, transparent 78%);
        }

        .portfolio-hero-inner {
            position: relative;
            z-index: 4;
            width: min(100%, 1320px);
            margin: 0 auto;
            display: grid;
            gap: clamp(2rem, 5vw, 4rem);
        }

        .portfolio-hero-meta {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1.5rem;
            align-items: end;
            color: rgba(203, 213, 225, 0.72);
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .portfolio-hero-meta::before {
            content: '';
            height: 1px;
            background: linear-gradient(90deg, rgba(203, 213, 225, 0.36), transparent);
        }

        .portfolio-hero-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(4.6rem, 18vw, 14.5rem);
            line-height: 0.78;
            font-weight: 800;
            letter-spacing: 0;
            color: #F8FAFC;
            text-shadow: 0 28px 80px rgba(0, 0, 0, 0.82);
        }

        .portfolio-hero-lower {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: clamp(2rem, 6vw, 5rem);
            align-items: end;
        }

        .portfolio-hero-subtitle {
            max-width: 42rem;
            color: rgba(226, 232, 240, 0.8);
            font-size: clamp(1rem, 1.35vw, 1.2rem);
            line-height: 1.8;
            text-align: left;
            margin: 0;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: flex-end;
        }

        .hero-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 3rem;
            padding: 0 1rem;
            border: 1px solid rgba(255, 255, 255, 0.14);
            cursor: pointer;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.035);
            color: rgba(248, 250, 252, 0.9);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            transition: transform 0.28s ease, border-color 0.28s ease, background 0.28s ease;
        }

        .hero-action.primary {
            background: rgba(103, 232, 249, 0.12);
            border-color: rgba(103, 232, 249, 0.42);
        }

        .hero-action:hover {
            transform: translateY(-3px);
            border-color: rgba(248, 250, 252, 0.42);
        }

        .hero-scroll-cue {
            position: absolute;
            right: clamp(1.5rem, 4vw, 4rem);
            bottom: clamp(1.5rem, 4vw, 3rem);
            z-index: 5;
            writing-mode: vertical-rl;
            color: rgba(148, 163, 184, 0.6);
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        @media (max-width: 900px) {
            .portfolio-hero {
                align-items: center;
                padding-top: 6.5rem;
            }

            .portfolio-hero-meta,
            .portfolio-hero-lower {
                grid-template-columns: 1fr;
            }

            .hero-actions {
                justify-content: flex-start;
            }

            .hero-scroll-cue {
                display: none;
            }
        }

        /* ============================================
           SCROLL PROGRESS INDICATOR
           ============================================ */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #3B82F6, #8B5CF6, #06B6D4);
            transform-origin: left;
            z-index: 10000;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        
        /* ============================================
           CUSTOM SCROLLBAR
           ============================================ */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1E293B;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #3B82F6, #8B5CF6);
            border-radius: 10px;
        }
        
        /* ============================================
           GLASSMORPHISM
           ============================================ */
        .glass {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }
        
        .glass-strong {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(148, 163, 184, 0.15);
        }
        
        /* ============================================
           CUSTOM CURSOR
           ============================================ */
        .cursor {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 2px solid rgba(59, 130, 246, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            mix-blend-mode: difference;
            opacity: 0;
        }
        
        .cursor-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            background: #3B82F6;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
        }

        .cursor.active,
        .cursor-dot.active {
            opacity: 1;
        }
        
        .cursor.hover {
            width: 80px;
            height: 80px;
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(139, 92, 246, 0.8);
        }
        
        .cursor.view::after {
            content: 'VIEW';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        /* ============================================
           GRADIENT TEXT
           ============================================ */
        .gradient-text {
            background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 50%, #06B6D4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% auto;
            animation: gradient-shift 18s ease-in-out infinite;
        }
        
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        /* ============================================
           NEON GLOW
           ============================================ */
        .neon-glow {
            box-shadow: 
                0 0 20px rgba(59, 130, 246, 0.3),
                0 0 40px rgba(139, 92, 246, 0.2),
                0 0 60px rgba(6, 182, 212, 0.1);
        }
        
        .neon-text {
            text-shadow: 
                0 0 10px rgba(59, 130, 246, 0.5),
                0 0 20px rgba(139, 92, 246, 0.3);
        }
        
        /* ============================================
           NOISE OVERLAY
           ============================================ */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9998;
            opacity: 0.5;
        }

        /* ============================================
           DECORATIVE ELEMENTS
           ============================================ */
        .deco-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.15;
            will-change: transform;
        }

        .floating-particles-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-particle {
            position: absolute;
            pointer-events: none;
        }

        .floating-particle-dot {
            width: 2px;
            height: 2px;
            background: radial-gradient(circle, #3B82F6, rgba(59, 130, 246, 0.3));
            border-radius: 50%;
            opacity: 0.4;
            box-shadow: 0 0 4px rgba(59, 130, 246, 0.3);
        }

        @media (max-width: 768px) {
            .floating-particles-bg {
                display: none;
            }
        }

        .deco-line::before {
            content: '';
            position: absolute;
            width: 1px;
            height: 100px;
            background: linear-gradient(180deg, transparent, rgba(59, 130, 246, 0.3), transparent);
            left: 50%;
            transform: translateX(-50%);
        }

        .gradient-divider {
            position: relative;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.5), transparent);
            margin: 60px 0;
        }

        /* ============================================
           SECTION TRANSITIONS
           ============================================ */
        .section-smooth {
            position: relative;
            scroll-margin-top: 96px;
            isolation: isolate;
        }

        .section-smooth::before,
        .section-smooth::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 220px;
            pointer-events: none;
            z-index: 0;
        }

        .section-smooth::before {
            top: -1px;
            background: linear-gradient(to bottom, rgba(6, 11, 24, 1), rgba(15, 23, 42, 0));
        }

        .section-smooth::after {
            bottom: -1px;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0));
        }

        .section-smooth > * {
            position: relative;
            z-index: 1;
        }

        .profile-intro-section {

        .profile-intro-eyebrow {

        /* ============================================
           ENHANCED ANIMATIONS
           ============================================ */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        @keyframes glow-pulse {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.3), 
                           0 0 40px rgba(139, 92, 246, 0.2);
            }
            50% { 
                box-shadow: 0 0 30px rgba(59, 130, 246, 0.5),
                           0 0 60px rgba(139, 92, 246, 0.3);
            }
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.3), 0 0 40px rgba(139, 92, 246, 0.2);
            }
            50% {
                box-shadow: 0 0 30px rgba(59, 130, 246, 0.5), 0 0 60px rgba(139, 92, 246, 0.3);
            }
        }

        @keyframes bounce-in {
            0% {
                opacity: 0;
                transform: scale(0.3) translateY(-50px);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes fade-in-down {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================
           CYBERPUNK THEMED ANIMATIONS
           ============================================ */
        @keyframes float-orb-purple {
            0% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(50px, -80px) scale(1.1);
            }
            50% {
                transform: translate(100px, 0) scale(1);
            }
            75% {
                transform: translate(50px, 80px) scale(1.15);
            }
            100% {
                transform: translate(0, 0) scale(1);
            }
        }

        @keyframes float-orb-blue {
            0% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(-60px, 70px) scale(1.15);
            }
            50% {
                transform: translate(-80px, 0) scale(1);
            }
            75% {
                transform: translate(-40px, -70px) scale(1.1);
            }
            100% {
                transform: translate(0, 0) scale(1);
            }
        }

        @keyframes scroll-down-bounce {
            0%, 100% {
                transform: translateY(0);
                opacity: 1;
            }
            50% {
                transform: translateY(8px);
                opacity: 0.7;
            }
        }

        @keyframes glow-pulse-enhanced {

                box-shadow: 
                    0 0 20px rgba(139, 92, 246, 0.6),
                    0 0 40px rgba(139, 92, 246, 0.4),
                    inset 0 0 20px rgba(139, 92, 246, 0.1);
            }
            50% {

                    0 0 30px rgba(139, 92, 246, 0.8),
                    0 0 60px rgba(139, 92, 246, 0.5),
                    inset 0 0 30px rgba(139, 92, 246, 0.15);
            }
        }

                transform: scale(0.95);

                transform: scale(0.93);

        .tag-container span:hover {
            color: #0DD9FF;
            border-color: rgba(6, 182, 212, 0.7);
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.18), rgba(59, 130, 246, 0.1));
            box-shadow: 
                inset 0 1px 3px rgba(6, 182, 212, 0.2),
                0 0 20px rgba(6, 182, 212, 0.15);
            transform: translateY(-2px);
        }

        .tag-container span:hover::before {
            opacity: 1;
        }

        .tag-container span:active {
            transform: translateY(-1px);
            box-shadow: 
                inset 0 1px 2px rgba(6, 182, 212, 0.1),
                0 0 10px rgba(6, 182, 212, 0.1);
        }

        @media (max-width: 768px) {
            .tag-container {
                gap: 8px;
            }

            .tag-container > div {
                height: 36px;
                padding: 0 16px;
                font-size: 11px;
            }

            .tag-container span {
                height: 36px;
                padding: 0 16px;
                font-size: 12px;
            }
        }

        /* Reduce motion for users who prefer it */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
        
        /* ============================================
           3D TILT CARD
           ============================================ */
        .tilt-card {
            transform-style: preserve-3d;
            will-change: transform;
        }
        
        .tilt-card-inner {
            transform: translateZ(20px);
            aspect-ratio: 3/5;
            overflow: hidden;
        }
        
        /* ============================================
           RIPPLE EFFECT
           ============================================ */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.5);
            transform: scale(0);
            animation: ripple-animation 0.6s ease-out;
            pointer-events: none;
        }
        
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        
        /* ============================================
           TYPEWRITER EFFECT
           ============================================ */
        .typewriter {
            overflow: hidden;
            border-right: 3px solid #3B82F6;
            white-space: nowrap;
            animation: 
                typing 3.5s steps(40, end),
                blink-caret 0.75s step-end infinite;
        }
        
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        
        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: #3B82F6; }
        }
        
        /* ============================================
           IMAGE LAZY LOAD FADE IN
           ============================================ */
        .lazy-image {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .lazy-image.loaded {
            opacity: 1;
        }
        
        /* ============================================
           RESPONSIVE
           ============================================ */
        /* Hide custom cursor on touch devices */
        @media (max-width: 768px), (hover: none) and (pointer: coarse) {
            body {
                cursor: auto;
            }
            .cursor, .cursor-dot {
                display: none !important;
            }
        }

        /* Optimize for landscape mode on mobile */
        @media (max-height: 500px) and (max-width: 768px) {
            section {
                padding-top: 20px !important;
                padding-bottom: 20px !important;
            }
            .py-20, .py-32 {
                padding-top: 20px !important;
                padding-bottom: 20px !important;
            }
        }
@keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

/* Skeleton Loading */
.skeleton { background: linear-gradient(90deg, rgba(30,41,59,0.5) 25%, rgba(51,65,85,0.5) 50%, rgba(30,41,59,0.5) 75%); background-size: 200% 100%; animation: skeleton-shimmer 1.5s infinite; border-radius: 8px; }
@keyframes skeleton-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skeleton-card { height: 400px; border-radius: 16px; border: 1px solid rgba(148,163,184,0.1); overflow: hidden; }
.skeleton-card .skeleton-image { height: 240px; }
.skeleton-card .skeleton-content { padding: 1.5rem; display: grid; gap: 0.75rem; }
.skeleton-card .skeleton-line { height: 14px; border-radius: 4px; }
.skeleton-card .skeleton-line.short { width: 40%; }
.skeleton-card .skeleton-line.medium { width: 70%; }

/* Scroll Reveal */
.reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
.reveal.visible { opacity: 1; transform: translateY(0); }
.reveal-left { opacity: 0; transform: translateX(-40px); transition: opacity 0.8s ease, transform 0.8s ease; }
.reveal-left.visible { opacity: 1; transform: translateX(0); }
.reveal-right { opacity: 0; transform: translateX(40px); transition: opacity 0.8s ease, transform 0.8s ease; }
.reveal-right.visible { opacity: 1; transform: translateX(0); }
.reveal-scale { opacity: 0; transform: scale(0.9); transition: opacity 0.6s ease, transform 0.6s ease; }
.reveal-scale.visible { opacity: 1; transform: scale(1); }

/* Toast Notifications */
.toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 99999; display: flex; flex-direction: column; gap: 0.75rem; pointer-events: none; }
.toast { pointer-events: auto; padding: 0.875rem 1.25rem; border-radius: 12px; backdrop-filter: blur(12px); border: 1px solid rgba(148,163,184,0.2); font-size: 0.875rem; font-weight: 500; color: white; animation: toast-in 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 10px 40px rgba(0,0,0,0.3); max-width: 360px; }
.toast.success { background: rgba(16,185,129,0.2); border-color: rgba(16,185,129,0.4); }
.toast.error { background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.4); }
.toast.info { background: rgba(6,182,212,0.2); border-color: rgba(6,182,212,0.4); }
.toast.exit { animation: toast-out 0.3s ease forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(-10px) scale(0.95); } }
@media (max-width: 768px) { .toast-container { left: 1rem; right: 1rem; bottom: 1rem; } .toast { max-width: 100%; } }

/* Playback Speed Button */
.speed-btn { font-size: 0.75rem !important; font-weight: 600; padding: 0.2rem 0.5rem !important; border-radius: 4px !important; min-width: 40px !important; font-family: 'Manrope', monospace; letter-spacing: -0.02em; }
.speed-btn:hover { background: rgba(255,255,255,0.15) !important; }

/* Theme Toggle */
[data-theme="light"] { --text-primary: #0F172A; --text-secondary: #1E293B; --text-tertiary: #334155; --text-quaternary: #64748B; --text-quinary: #94A3B8; }
[data-theme="light"] body { background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%); color: #334155; }
[data-theme="light"] .glass, [data-theme="light"] .glass-strong { background: rgba(255,255,255,0.7); border-color: rgba(0,0,0,0.1); }
[data-theme="light"] .noise-overlay { opacity: 0.02; }
.theme-toggle { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(148,163,184,0.3); background: transparent; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
.theme-toggle:hover { border-color: var(--accent-primary); background: rgba(6,182,212,0.1); }

/* Skip Link */
.skip-link { position: absolute; top: -100%; left: 1rem; padding: 0.75rem 1.5rem; background: var(--accent-primary); color: white; border-radius: 0 0 8px 8px; z-index: 100000; font-weight: 600; transition: top 0.3s; }
.skip-link:focus { top: 0; }

/* ============================================
   EDITORIAL FILM PORTFOLIO SYSTEM
   ============================================ */
:root {
    --ink: #030407;
    --ink-soft: #080B12;
    --paper: #F4F1E8;
    --silver: #D8DCE2;
    --muted-silver: rgba(216, 220, 226, 0.62);
    --line-soft: rgba(244, 241, 232, 0.13);
    --accent-film: #67E8F9;
}

body {
    background: var(--ink);
}

.noise-overlay,
.floating-particles-bg {
    opacity: 0.24;
}

.editorial-loader.loading-screen {
    background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
        radial-gradient(circle at 78% 18%, rgba(103, 232, 249, 0.1), transparent 28%),
        #030407;
    background-size: 48px 48px, 48px 48px, auto, auto;
}

.editorial-loader .loading-particles {
    display: none;
}

.loader-frame {
    position: relative;
    width: min(88vw, 1040px);
    min-height: min(62vh, 560px);
    padding: clamp(1.1rem, 3vw, 2rem);
    display: grid;
    grid-template-rows: auto 1fr auto;
    border: 1px solid rgba(244, 241, 232, 0.24);
    background:
        linear-gradient(90deg, transparent 49.8%, rgba(244, 241, 232, 0.1) 50%, transparent 50.2%),
        rgba(3, 4, 7, 0.82);
    box-shadow: 0 34px 110px rgba(0, 0, 0, 0.62);
    overflow: hidden;
}

.loader-frame::before,
.loader-frame::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.loader-frame::before {
    background-image: repeating-linear-gradient(90deg, transparent 0 34px, rgba(244, 241, 232, 0.1) 34px 35px);
    opacity: 0.18;
}

.loader-frame::after {
    background: linear-gradient(180deg, transparent, rgba(103, 232, 249, 0.13), transparent);
    height: 34%;
    animation: projector-scan 1.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
}

.loader-topline,
.loader-bottomline {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    color: rgba(244, 241, 232, 0.58);
    font-size: clamp(0.68rem, 1vw, 0.82rem);
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
}

.loader-title {
    position: relative;
    z-index: 1;
    align-self: center;
    font-family: 'Syne', sans-serif;
    font-size: clamp(2.8rem, 11vw, 8rem);
    line-height: 0.78;
    font-weight: 800;
    letter-spacing: 0;
    color: var(--paper);
    text-transform: none;
}

.loader-bottomline {
    display: grid;
    grid-template-columns: auto 1fr auto;
}

.loader-progress {
    height: 1px;
    background: rgba(244, 241, 232, 0.16);
    overflow: hidden;
}

.loader-progress span {
    display: block;
    width: 42%;
    height: 100%;
    background: linear-gradient(90deg, transparent, var(--paper), var(--accent-film));
    animation: loading-scan 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite;
}

@keyframes projector-scan {
    from { transform: translateY(-120%); }
    to { transform: translateY(340%); }
}

.editorial-nav {
    border-bottom: 1px solid rgba(244, 241, 232, 0.08);
}

.nav-wordmark {
    font-family: 'Syne', sans-serif;
    color: var(--paper);
    letter-spacing: 0;
}

.nav-link-editorial {
    color: rgba(244, 241, 232, 0.62);
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
}

.nav-link-editorial:hover {
    color: var(--paper);
}

.editorial-hero {
    position: relative;
    min-height: 100svh;
    display: grid;
    align-items: end;
    overflow: hidden;
    padding: clamp(7rem, 12vw, 10rem) clamp(1.25rem, 4vw, 4rem) clamp(1.5rem, 4vw, 3rem);

.editorial-hero::before {
    content: '';

    inset: 0;

.reel-project-frame::before {

        // Loading Hook with Particles - 优化版
        function usePageLoading() {
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                // Generate particles for loading screen - 减少数量提升性能
                const particlesContainer = document.getElementById('loadingParticles');
                if (particlesContainer) {
                    // 检测设备性能，移动端减少粒子数量
                    const isMobile = window.innerWidth < 768;
                    const particleCount = isMobile ? 6 : 12;

                    for (let i = 0; i < particleCount; i++) {
                        const particle = document.createElement('div');
                        particle.className = 'particle';
                        const size = Math.random() * 2 + 1;
                        const x = Math.random() * window.innerWidth;
                        const y = Math.random() * window.innerHeight;
                        const tx = (Math.random() - 0.5) * 100;
                        const ty = (Math.random() - 0.5) * 100;
                        const duration = Math.random() * 1.5 + 1.5;
                        const delay = Math.random() * 0.2;

                        particle.style.left = x + 'px';
                        particle.style.top = y + 'px';
                        particle.style.width = size + 'px';
                        particle.style.height = size + 'px';
                        particle.style.setProperty('--tx', tx + 'px');
                        particle.style.setProperty('--ty', ty + 'px');
                        particle.style.animationDuration = duration + 's';
                        particle.style.animationDelay = delay + 's';

                        particlesContainer.appendChild(particle);
                    }
                }

                const timer = setTimeout(() => {
                    setLoading(false);
                    document.getElementById('loadingScreen')?.classList.add('hidden');
                }, 800); // 从 1200ms 降到 800ms，提升首屏反馈速度

                return () => clearTimeout(timer);
            }, []);

            return loading;
        }
        
        // Scroll Progress Hook
        function useScrollProgress() {
            useEffect(() => {
                const progressBar = document.getElementById('scrollProgress');
                if (!progressBar) return;
                
                let ticking = false;
                const updateProgress = () => {
                    if (!ticking) {
                        window.requestAnimationFrame(() => {
                            const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
                            const scrolled = window.scrollY;
                            const progress = (scrolled / scrollHeight) * 100;
                            progressBar.style.width = progress + '%';
                            ticking = false;
                        });
                        ticking = true;
                    }
                };
                
                window.addEventListener('scroll', updateProgress, { passive: true });
                return () => window.removeEventListener('scroll', updateProgress);
            }, []);
        }

        // Floating Background Particles Hook - 优化版
        function useFloatingParticles() {
            useEffect(() => {
                const container = document.getElementById('floatingParticlesBg');
                if (!container || window.innerWidth < 768) return;

                // 减少粒子数量，采用更合理的计算方式
                const particleCount = Math.min(12, Math.floor(window.innerWidth / 150));

                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'floating-particle';

                    const x = Math.random() * 100;
                    const y = Math.random() * 100;
                    const duration = Math.random() * 6 + 10;
                    const delay = Math.random() * 1.5;

                    particle.style.left = x + '%';
                    particle.style.top = y + '%';

                    const dot = document.createElement('div');
                    dot.className = 'floating-particle-dot';
                    dot.style.animation = `float ${duration}s ease-in-out ${delay}s infinite`;

                    particle.appendChild(dot);
                    container.appendChild(particle);
                }

                // Animation keyframe for floating - 简化动画计算
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes float {
                        0%, 100% {
                            transform: translateY(0px);
                            opacity: 0.3;
                        }
                        50% {
                            transform: translateY(-40px);
                            opacity: 0.5;
                        }
                    }
                `;
                document.head.appendChild(style);
            }, []);
        }
        
        // Enhanced Custom Cursor with Throttling & Mobile Detection
        function useCustomCursor() {
            useEffect(() => {
                // Disable custom cursor on mobile devices
                const isMobile = window.innerWidth < 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                if (isMobile) {
                    return;
                }
                
                const cursor = document.querySelector('.cursor');
                const cursorDot = document.querySelector('.cursor-dot');
                
                if (!cursor || !cursorDot) return;
                
                let mouseX = 0;
                let mouseY = 0;
                let cursorX = 0;
                let cursorY = 0;
                let dotX = 0;
                let dotY = 0;
                let isMoving = false;
                
                const animateCursor = () => {
                    if (isMoving) {
                        cursorX += (mouseX - cursorX) * 0.15;
                        cursorY += (mouseY - cursorY) * 0.15;
                        dotX += (mouseX - dotX) * 0.25;
                        dotY += (mouseY - dotY) * 0.25;
                        
                        cursor.style.left = cursorX + 'px';
                        cursor.style.top = cursorY + 'px';
                        cursorDot.style.left = dotX + 'px';
                        cursorDot.style.top = dotY + 'px';
                        
                        isMoving = false;
                    }
                    requestAnimationFrame(animateCursor);
                };
                
                animateCursor();
                
                const moveCursor = (e) => {
                    cursor.classList.add('active');
                    cursorDot.classList.add('active');
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                    isMoving = true;
                };
                
                const handleHover = (e) => {
                    cursor.classList.add('hover');
                    if (e.target.classList.contains('project-image')) {
                        cursor.classList.add('view');
                    }
                };
                
                const handleLeave = () => {
                    cursor.classList.remove('hover', 'view');
                };
                
                window.addEventListener('mousemove', moveCursor, { passive: true });
                
                const hoverElements = document.querySelectorAll('a, button, .hoverable, .project-image');
                hoverElements.forEach(el => {
                    el.addEventListener('mouseenter', handleHover);
                    el.addEventListener('mouseleave', handleLeave);
                });
                
                return () => {
                    window.removeEventListener('mousemove', moveCursor);
                };
            }, []);
        }

        function HoverButton({ className = "", children, style, ...props }) {
            const buttonRef = useRef(null);
            const [isListening, setIsListening] = useState(false);
            const [circles, setCircles] = useState([]);
            const lastAddedRef = useRef(0);

            const createCircle = useCallback((x, y) => {
                const buttonWidth = buttonRef.current?.offsetWidth || 1;
                const xPos = x / buttonWidth;
                const color = `linear-gradient(to right, var(--circle-start) ${xPos * 100}%, var(--circle-end) ${xPos * 100}%)`;

                setCircles((prev) => [
                    ...prev,
                    { id: Date.now() + Math.random(), x, y, color, fadeState: null },
                ]);
            }, []);

            const handlePointerMove = useCallback(
                (event) => {
                    if (!isListening) return;

                    const currentTime = Date.now();
                    if (currentTime - lastAddedRef.current > 100) {
                        lastAddedRef.current = currentTime;
                        const rect = event.currentTarget.getBoundingClientRect();
                        const x = event.clientX - rect.left;
                        const y = event.clientY - rect.top;
                        createCircle(x, y);
                    }
                },
                [isListening, createCircle]
            );

            useEffect(() => {
                circles.forEach((circle) => {
                    if (!circle.fadeState) {
                        setTimeout(() => {
                            setCircles((prev) =>
                                prev.map((c) =>
                                    c.id === circle.id ? { ...c, fadeState: "in" } : c
                                )
                            );
                        }, 0);

                        setTimeout(() => {
                            setCircles((prev) =>
                                prev.map((c) =>
                                    c.id === circle.id ? { ...c, fadeState: "out" } : c
                                )
                            );
                        }, 1000);

                        setTimeout(() => {
                            setCircles((prev) => prev.filter((c) => c.id !== circle.id));
                        }, 2200);
                    }
                });
            }, [circles]);

            return (
                <button
                    ref={buttonRef}
                    className={cn(
                        "hover-button relative isolate px-8 py-3 rounded-3xl",
                        "text-foreground font-medium text-base leading-6",
                        "backdrop-blur-lg bg-[rgba(43,55,80,0.1)]",
                        "cursor-pointer overflow-hidden",
                        "before:content-[''] before:absolute before:inset-0 before:rounded-[inherit] before:pointer-events-none before:z-[0]",
                        "before:shadow-[inset_0_0_0_1px_rgba(170,202,255,0.2),inset_0_0_16px_0_rgba(170,202,255,0.1),inset_0_-3px_12px_0_rgba(170,202,255,0.15),0_1px_3px_0_rgba(0,0,0,0.50),0_4px_12px_0_rgba(0,0,0,0.45)]",
                        "before:mix-blend-multiply before:transition-transform before:duration-300 active:before:scale-[0.975]",
                        className
                    )}
                    onPointerMove={handlePointerMove}
                    onPointerEnter={() => setIsListening(true)}
                    onPointerLeave={() => setIsListening(false)}
                    {...props}
                    style={{
                        "--circle-start": "var(--tw-gradient-from, #a0d9f8)",
                        "--circle-end": "var(--tw-gradient-to, #3a5bbf)",
                        ...style,
                    }}
                >
                    {circles.map(({ id, x, y, color, fadeState }) => (
                        <div
                            key={id}
                            className={cn(
                                "absolute w-3 h-3 -translate-x-1/2 -translate-y-1/2 rounded-full blur-lg pointer-events-none z-[1] transition-opacity duration-300",
                                fadeState === "in" && "opacity-75",
                                fadeState === "out" && "opacity-0 duration-[1.2s]",
                                !fadeState && "opacity-0"
                            )}
                            style={{
                                left: x,
                                top: y,
                                background: color,
                            }}
                        />
                    ))}
                    <span className="relative z-[2]">{children}</span>
                </button>
            );
        }

        // 网络连接检测和性能优化
        const useNetworkStatus = () => {
            const [effectiveType, setEffectiveType] = useState('4g');
            const [isOnline, setIsOnline] = useState(true);
            
            useEffect(() => {
                const updateNetworkStatus = () => {
                    // 检查网络连接
                    setIsOnline(navigator.onLine);
                    
                    // 检查网络类型（如果支持 Network Information API）
                    if (navigator.connection) {
                        setEffectiveType(navigator.connection.effectiveType || '4g');
                    }
                };
                
                updateNetworkStatus();
                window.addEventListener('online', updateNetworkStatus);
                window.addEventListener('offline', updateNetworkStatus);
                
                if (navigator.connection) {
                    navigator.connection.addEventListener('change', updateNetworkStatus);
                }
                
                return () => {
                    window.removeEventListener('online', updateNetworkStatus);
                    window.removeEventListener('offline', updateNetworkStatus);
                    if (navigator.connection) {
                        navigator.connection.removeEventListener('change', updateNetworkStatus);
                    }
                };
            }, []);

            const [playbackRate, setPlaybackRate] = React.useState(1);

                if (isNaN(s)) return '0:00';
                const m = Math.floor(s / 60);
                const sec = Math.floor(s % 60);
                return m + ':' + String(sec).padStart(2, '0');
            };

            const resetControlsTimeout = () => {
                setShowControls(true);
                if (controlsTimeout.current) clearTimeout(controlsTimeout.current);
                controlsTimeout.current = setTimeout(() => {
                    if (isPlaying) setShowControls(false);
                }, 3000);
            };

            React.useEffect(() => {
                const mobile = window.innerWidth < 768 || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
                setIsMobile(mobile);
                const handleKey = (e) => {
                    if (e.key === 'Escape') onClose();
                    if (!videoRef.current) return;
                    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
                    if (e.key === 'ArrowLeft') videoRef.current.currentTime = Math.max(0, videoRef.current.currentTime - 5);
                    if (e.key === 'ArrowRight') videoRef.current.currentTime = Math.min(videoRef.current.duration, videoRef.current.currentTime + 5);
                    if (e.key === 'm' || e.key === 'M') toggleMute();
                    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
                };
                const handleFullscreenChange = () => {
                    setIsFullscreen(!!document.fullscreenElement);

                document.addEventListener('keydown', handleKey);
                document.addEventListener('fullscreenchange', handleFullscreenChange);

                document.body.style.position = 'fixed';
                document.body.style.width = '100%';
                return () => {
                    document.removeEventListener('keydown', handleKey);
