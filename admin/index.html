<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIGC CMS - 作品管理</title>
  <link rel="stylesheet" href="admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../src/config.js"></script>
</head>
<body>

  <!-- Login View -->
  <div id="loginView" class="login-wrapper">
    <div class="login-card">
      <h2>🎬 AIGC CMS</h2>
      <p class="subtitle">作品集管理系统</p>
      <form id="loginForm">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="loginUsername" placeholder="admin" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <div id="loginError" style="color: var(--danger); font-size: 0.85rem; margin-bottom: 1rem; display: none;"></div>
        <button type="submit" class="btn btn-primary btn-full">登录</button>
      </form>
    </div>
  </div>

  <!-- Admin Dashboard View -->
  <div id="dashboardView" class="admin-container" style="display: none;">
    <div class="admin-header">
      <h1>🎬 <span class="logo-accent">AIGC</span> 作品管理</h1>
      <div style="display: flex; gap: 0.75rem; align-items: center;">
        <a href="/" class="btn btn-secondary btn-sm">← 返回网站</a>
        <button id="logoutBtn" class="btn btn-secondary btn-sm">退出</button>
      </div>
    </div>

    <!-- Toolbar -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
      <div style="font-size: 0.9rem; color: var(--text-muted);">
        共 <span id="projectCount">0</span> 个作品
      </div>
      <button id="addProjectBtn" class="btn btn-primary">+ 新建作品</button>
    </div>

    <!-- Project List -->
    <div id="projectList" class="project-list">
      <div class="empty-state">
        <div class="icon">📂</div>
        <p>还没有作品，点击上方按钮添加第一个</p>
      </div>
    </div>
  </div>

  <!-- Edit/Create Modal -->
  <div id="editorModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="editorTitle">新建作品</h2>
        <button class="modal-close" id="closeEditor">×</button>
      </div>
      <div class="modal-body">
        <form id="projectForm">
          <input type="hidden" id="editProjectId">

          <div class="form-row">
            <div class="form-group">
              <label>标题（中文）*</label>
              <input type="text" id="fTitleZh" placeholder="作品标题" required>
            </div>
            <div class="form-group">
              <label>标题（英文）</label>
              <input type="text" id="fTitleEn" placeholder="English title">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>分类</label>
              <select id="fCategory">
                <option value="video">品牌视频</option>
                <option value="animation">动画短片</option>
                <option value="architecture">建筑可视化</option>
              </select>
            </div>
            <div class="form-group">
              <label>时长</label>
              <input type="text" id="fDuration" placeholder="例: 2:30">
            </div>
          </div>

          <div class="form-group">
            <label>作品描述</label>
            <textarea id="fDescription" placeholder="描述作品亮点、技术栈、商业价值..."></textarea>
          </div>

          <div class="form-group">
            <label>标签（回车添加）</label>
            <div class="tags-container" id="tagsContainer">
              <input type="text" id="tagInput" placeholder="输入标签后回车">
            </div>
          </div>

          <!-- Cover Image Upload -->
          <div class="form-group">
            <label>封面图片</label>
            <div class="upload-area" id="coverUploadArea">
              <div class="upload-icon">🖼️</div>
              <div class="upload-text">点击或拖拽上传封面图<br><small>JPG / PNG / WebP，最大 15MB</small></div>
              <input type="file" id="coverFileInput" accept="image/jpeg,image/png,image/webp">
            </div>
            <div class="file-info" id="coverFileInfo">
              <span id="coverFileName"></span>
              <button type="button" class="btn btn-sm btn-danger" id="removeCover">移除</button>
            </div>
          </div>

          <!-- Video Upload -->
          <div class="form-group">
            <label>视频文件</label>
            <div class="upload-area" id="videoUploadArea">
              <div class="upload-icon">🎬</div>
              <div class="upload-text">点击或拖拽上传视频<br><small>MP4 / WebM / MOV，最大 500MB（支持分块上传）</small></div>
              <input type="file" id="videoFileInput" accept="video/mp4,video/webm,video/quicktime,video/x-msvideo">
            </div>
            <div class="upload-progress" id="videoProgress">
              <div class="progress-bar"><div class="fill" id="progressFill" style="width: 0%"></div></div>
              <div class="progress-text" id="progressText">准备上传...</div>
            </div>
            <div class="file-info" id="videoFileInfo">
              <span id="videoFileName"></span>
              <button type="button" class="btn btn-sm btn-danger" id="removeVideo">移除</button>
            </div>
          </div>

          <!-- Toggles -->
          <div class="toggle-row">
            <span class="toggle-label">发布状态</span>
            <label class="toggle">
              <input type="checkbox" id="fPublished" checked>
              <span class="slider"></span>
            </label>
          </div>
          <div class="toggle-row">
            <span class="toggle-label">精选推荐</span>
            <label class="toggle">
              <input type="checkbox" id="fFeatured">
              <span class="slider"></span>
            </label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelEditor">取消</button>
        <button class="btn btn-primary" id="saveProject">保存</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteModal" class="modal-overlay">
    <div class="modal" style="max-width: 420px;">
      <div class="modal-header">
        <h2>确认删除</h2>
        <button class="modal-close" id="closeDelete">×</button>
      </div>
      <div class="modal-body">
        <p>确定要删除「<span id="deleteProjectName"></span>」吗？</p>
        <p style="color: var(--danger); font-size: 0.85rem; margin-top: 0.5rem;">此操作不可撤销，关联的视频和封面文件也会被删除。</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelDelete">取消</button>
        <button class="btn btn-danger" id="confirmDelete">确认删除</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="admin.js"></script>
</body>
</html>
