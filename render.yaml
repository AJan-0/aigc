services:
  - type: web
    name: aigc-portfolio
    runtime: node
    region: singapore  # closest to China
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: ADMIN_USERNAME
        generateValue: false
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
